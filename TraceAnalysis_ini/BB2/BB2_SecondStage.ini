%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Second stage ini_file for BB2
%
% Jan, 2023 June Skeeter
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% Revisions:
%
% 15 May 2026 (Karolina)
%   - Corrected soil volumetric water content variable name (from VWC to SWC)
%
% 11 May 2026 (Karolina)
%   -  Edited gap filled variables to have correct Ameriflux formatting (e.g. TA_F_1_1_1 instead of TA_1_1_1_F). 
%   -  See bottom of webpage: https://ameriflux.lbl.gov/data/aboutdata/data-variables/
%
% 7 April 2026 (Rosie)
%	- Created and added functions vapPressDeficit, calcNetRad, and calcAlb, for recalculating VPD, NETRAD, and 
%	  ALB respectively, to reduce clutter. Functions include application of minMax values.
%	- PPFD_OUT_1_1_1 gap-filling is removed: SW_IN_1_1_1 is not a good enough fit. Missing max of ~2% data points, <1% in most years.
%	- P/WS/WD from ECCC and BB are NOT good substitutes for gap-filling - removed. BB is slightly better for (P and WS, bad for WD) 
%	  but not worth it, most years have little missing data and most missing is <2% (~6 days) in 2024.
%	- Changed WS_/WD_ from 2_1_1 to 1_2_1: per database meeting discussion on 9 March 2026, determined they can be described 
%	  as vertical profile (like other BC sites). 
%
% 2 April 2026 (Rosie)
%	- Edited to use gapFillUsingAltSensor instead of old gap-filling algorithm (calc_avg_trace): 
%		- TA_1_1_1_F allows slightly higher maxSlope in 2019 where there is only a couple of months of data	 (good fit in other years)
%		- RH_1_1_1_F allows slightly lower minSlope for later years. 
%
% 4 December 2025 (Rosie)
%	- Changed notation to be "Ameriflux-friendly": provide both non-gap-filled and gap-filled variables for AMF, 
%	  as well as gap-filled '_F' for internal/data sharing.
%
% 24 April 2025 (Rosie)
%	- Edited BB_WTH_Corrections_v2.m function (directly in function) used for correcting water table height, using Pipe_Height and WTD. 
%	  Also, changed conditions under which function is called in this INI file, in WTD_1 trace: pipe height and WTD do not exist for all years so cannot run correction every year. 
%
% 1 April 2025 (Rosie)
% 	- Tidied up following addition of include files in first stage. 
%	- Added bounds to averaged RH to prevent > 100%
%	- Removed RH_1_2_1 as first stage measurements are problematic for 2023/2024 (***come back to this in case they are good for other years...)
%	- Added NETRAD and ALB calculations back to second stage (removed from first stage RAD include file) on principle, because they are 
% 	  "modelled" not measured.
%
% Feb 3, 2023 (Zoran)
%   - changed 
%      searchPath = 'low_level,current'
%     to
%      searchPath = 'auto'
%
% 20230111: Modified for June Skeeter local database


Site_name = 'Burns Bog 2'
SiteID = 'BB2'
input_path    = ''
output_path   = '' 
high_level_path = {}
searchPath = 'auto'

% ---------------------------------------------------------------------------------------
% Create a generic trace and variables if needed
% Variables created here will be available to all other traces below saving extra typing
% ---------------------------------------------------------------------------------------
% all_nan and processingYear are useful for handling missing data, if relevant
[Trace]
	variableName = 'all_nan'
	Evaluate = 'all_nan = nan(size(clean_tv));
                processingYear = yearIn;'
	title = 'define all_nan trace and other global variables'
	units = ''
[End]

% ----------------------------------------------------------------------------
% Temperature and relative humidity variables
% ----------------------------------------------------------------------------

% non-gap-filled TA
[Trace]
	variableName = 'TA_1_1_1'
	Evaluate = 'TA_1_1_1 = TA_1_1_1;'
	title = 'Air temperature at 2m (HMP)'
	units = '^oC'
[End]

% gap-filled TA
[Trace]
	variableName = 'TA_F_1_1_1'
	Evaluate     = 'if(processingYear<2020),
						qaqcIn = [];
						qaqcIn.maxSlope = 1.14;
						TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],qaqcIn,1,"TA_F_1_1_1"); % default is 1.05; determined that 1.14 is justified following testing
					else
						TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],[],1,"TA_F_1_1_1");
					end;'
	title = 'Air temperature at 2m (HMP), gap-filled using ECCC'
	units = '^oC'
[End]

% non-gap-filled RH
[Trace]
	variableName = 'RH_1_1_1'
	Evaluate = 'RH_1_1_1 = RH_1_1_1;'
	title = 'RH at 2m (HMP)'
	units = '%'
[End]

% gap-filled RH
[Trace]
	variableName = 'RH_F_1_1_1'
	Evaluate = 'qaqcIn = [];
				qaqcIn.polyfitWithoutClamped = 2;
				qaqcIn.clamped_minMax = [0,100];
				qaqcIn.r2min = 0.89;	% following testing, all r2 are 0.90 and above, will allow this 
				qaqcIn.minSlope = 0.80;		% after discussion with Sara, OK for slope to be >=0.80 (9 April 2026)
				RH_F_1_1_1 = gapFillUsingAltSensor(RH_1_1_1,RH_ECCC,[],qaqcIn,1,"RH_F_1_1_1");'
	title = 'RH at 2m (HMP), gap-filled using ECCC'
	units = '%'
[End]

% non-gap-filled VPD
[Trace]
	variableName = 'VPD_1_1_1'
	Evaluate = 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title = 'Vapour pressure deficit Vapour pressure deficit (from 2m HMP)'
	units = 'hPa'
[End]

% gap-filled VPD
[Trace]
	variableName = 'VPD_F_1_1_1'
	Evaluate = 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_F_1_1_1);'
	title = 'Vapour pressure deficit Vapour pressure deficit (from 2m HMP), using gap-filled TA and RH with ECCC'
	units = 'hPa'
[End]

[Trace]
	variableName = 'TS_1_1_1'
	Evaluate = 'TS_1_1_1 = TS_1_1_1;'
	title = 'average soil temperature at 5cm depth'
	units = '^oC'
[End]

[Trace]
	variableName = 'TS_1_2_1'
	Evaluate = 'TS_1_2_1 = TS_1_2_1;'
	title = 'average soil temperature at 10cm depth'
	units = '^oC'
[End]

[Trace]
	variableName = 'TS_1_3_1'
	Evaluate = 'TS_1_3_1 = TS_1_3_1;'
	title = 'average soil temperature at 30cm depth'
	units = '^oC'
[End]

[Trace]
	variableName = 'TS_1_4_1'
	Evaluate = 'TS_1_4_1 = TS_1_4_1;'
	title = 'average soil temperature at 50cm depth'
	units = '^oC'
[End]

[Trace]
	variableName = 'G_1'
	Evaluate = 'G_1 = mean([G_1_1_1, G_2_1_1, G_3_1_1],2,"omitnan");'
	title = 'soil heat flux at 5cm depth'
	units = '∞C'
[End]


[Trace]
	variableName = 'SW_IN_1_1_1'
	Evaluate = 'SW_IN_1_1_1 = SW_IN_1_1_1;'
	title = 'incoming shortwave radiation by CNR1'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'SW_OUT_1_1_1'
	Evaluate = 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'
	title = 'reflected shortwave radiation by CNR1'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'LW_IN_1_1_1'
	Evaluate = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title = 'incoming long wave radiation by CNR1'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'LW_OUT_1_1_1'
	Evaluate = 'LW_OUT_1_1_1 = LW_OUT_1_1_1;'
	title = 'outgoing long wave radiation by CNR1'
	units = 'W/m^2'
[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName 	= 'NETRAD_1_1_1'
	Evaluate 		= 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title 			= 'net radiation by CNR4'
	units 			= 'W/m^2'
[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName 	= 'ALB_1_1_1'
	Evaluate 		= 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);' 
	title 			= 'albedo by CNR4'
	units 			= '%'
[End]

% non gap-filled PPFD
[Trace]
	variableName = 'PPFD_IN_1_1_1'
    Evaluate = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title = 'incoming PAR'
	units = '\mu mol/m^2/s'
[End]

[Trace]
	variableName = 'PPFD_OUT_1_1_1'
    Evaluate = 'PPFD_OUT_1_1_1 = PPFD_OUT_1_1_1;'
	title = 'reflected PAR'
	units = '\mu mol/m^2/s'
[End]

% gap-filled PPFD
[Trace]
	variableName = 'PPFD_IN_F_1_1_1'
    Evaluate = 'qaqcIn=[];
                qaqcIn.maxSlope = 2.34;		% determined 2.34 is justified after testing (r^2 always good, slope consistent)
                PPFD_IN_F_1_1_1 = gapFillUsingAltSensor(PPFD_IN_1_1_1,SW_IN_1_1_1,[],qaqcIn,1,"PPFD_IN_F_1_1_1");'
	title = 'incoming PAR'
	units = '\mu mol/m^2/s'
[End]

% no gap-filled PPFD_OUT_1_1_1, SW_IN_1_1_1 not a good fit across all years

% non-gap-filled PA
[Trace]
	variableName = 'PA_1_1_1'
	Evaluate = 'PA_1_1_1 = PA_1_1_1;'
	title = 'air pressure by CS106 installed in the logger box'
	units = 'kPa' 
[End]

% gap-filled PA
[Trace]
	variableName = 'PA_F_1_1_1'
	Evaluate = 'PA_F_1_1_1 = gapFillUsingAltSensor(PA_1_1_1,PA_ECCC,[],[],1,"PA_F_1_1_1");'
	title = 'air pressure by CS106 installed in the logger box, gap-filled using ECCC'
	units = 'kPa' 
[End]

% non-gap-filled precip
[Trace]
	variableName = 'P_1_1_1'
	Evaluate = 'P_1_1_1 = P_1_1_1;'
	title = 'precipitation at 1.05m height'
	units = 'mm' 
[End]

% no gap-filled precip, neither ECCC nor BB are a good fit

[Trace]
	variableName = 'WTH_1'
	Evaluate = 'WTH_1 = WTH_1_1_1;'
	title = 'water table height above the pressure transducer'
	units = 'cm'
[End]

[Trace]
	variableName = 'WTD_1'
	Evaluate = 'startYear = 2023; 
				if (yearIn >= startYear)
					WTD_1 = BB_WTH_Corrections_v2(SiteID,yearIn);
					WTD_1 = -.01*WTD_1;end;
				if (yearIn < startYear)
					WTD_1 = NaN(length(clean_tv),1);
				end;'
	title = 'water table depth corrected for pipe height and drift correction'
	units = 'm'
[End]

[Trace]
	variableName = 'SWC_1_1_1'
	Evaluate = 'SWC_1_1_1 = SWC_1_1_1;'
	title = 'volumetric water content'
	units = '%'
[End]

[Trace]
	variableName = 'TW_1'
	Evaluate = 'TW_1 = mean([TW_1_1_1, TW_2_1_1, TW_3_1_1],2,"omitnan");'
	title = 'water temperature 5cm'
	units = '∞C'
[End]

% non-gap-filled WS
[Trace]
	variableName = 'WS_1_1_1'
	Evaluate = 'WS_1_1_1 = WS_1_1_1;'
	title = 'wind speed by RM Young'
	units = 'm/s' 
[End]

% no gap-filled WS, clearly non-linear relationship with BB, and ECCC no good at all. 

% non-gap-filled WD
[Trace]
	variableName = 'WD_1_1_1'
	Evaluate = 'WD_1_1_1 = WD_1_1_1;'
	title = 'wind direction'
	units = 'm/s' 
[End]

% no gap-filled WD, neither ECCC nor BB are a good fit

[Trace]
	variableName = 'WS_1_2_1'
	Evaluate = 'WS_1_2_1 = WS;'
	title = 'Mean wind speed (CSAT3)'
	units = 'm/s' 
[End]

[Trace]
	variableName = 'WD_1_2_1'
	Evaluate = 'WD_1_2_1 = wind_dir;'
	title = 'Direction from which the wind blows, with respect to Geographic or Magnetic north (CSAT3)'
	units = 'm/s' 
[End]


%[Trace]
%	variableName = 'Season'
%	Evaluate = 'Season = Season;'
%	title = 'Season'
%	units = 'arb' 
%	minMax = [1,4]
%[End]


% ----------------------------------------------------------------------------
% Turbulent fluxes LI-7200 & LI-7700
% ----------------------------------------------------------------------------

% Should we be applying the run_std_dev spike removeal to EC data?
% Should we try MAD instead?
% Or just leave it alone?

[Trace]
	variableName = 'CO2'
	Evaluate = 'CO2 = CO2;'
	title = 'CO2 in mole fraction of wet air'
	units = '\mu mol / mol wet air'
[End]

[Trace]
	variableName = 'H2O'
	Evaluate = 'H2O = H2O;'
	title = 'H2O in mole fraction of wet air'
	units = 'mm mol / mol wet air'
[End]

[Trace]
	variableName = 'CH4'
	Evaluate = 'CH4 = CH4;'
	title = 'CH4 in mole fraction of wet air'
	units = 'nmol / mol wet air' % Confirm units - I think sensor outpus values in umol/mol? 
[End]


[Trace]
	variableName = 'USTAR'
	Evaluate = 'USTAR = USTAR;'
	title = 'Friction Velocity'
	units = 'm/s'
[End]

[Trace]
	variableName = 'w_ts_cov'
	Evaluate = 'w_ts_cov = w_ts_cov;'
	title = 'Covariance of w and sonic temperature (Sonic, after rotation)'
	units = 'm/s degK'
[End]

[Trace]
	variableName = 'w_h2o_cov'
	Evaluate = 'w_h2o_cov = w_h2o_cov;'
	title = 'Covariance of w and water vapour mixing ratio (after rotation)'
	units = 'm/s mmol/mol'
[End]

[Trace]
	variableName = 'w_co2_cov'
	Evaluate = 'w_co2_cov = w_co2_cov;'
	title = 'Covariance of w and CO2 (after rotation)'
	units = 'm/s umol/mol'
[End]

[Trace]
	variableName = 'w_ch4_cov'
	Evaluate = 'w_ch4_cov = w_ch4_cov;'
	title = 'Covariance of w and CH4 (after rotation)'
	units = 'm/s nmol/mol' % Check units
[End]


[Trace]
	variableName = 'LE'
	Evaluate = 'LE = LE;'
	title = 'Latent Heat Flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'SLE'
	Evaluate = 'SLE = SLE;'
	title = 'Estimate of storage latent heat flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'H'
	Evaluate = 'H = H;'
	title = 'sensible heat flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'SH'
	Evaluate = 'SH = SH;'
	title = 'Estimate of storage sensible heat flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'FC'
	Evaluate = 'FC = FC;'
	
	title = 'CO_2 Flux'
	units = '\mu mol m^{-2} s^{-1}'
[End]

[Trace]
	variableName = 'SC'
	Evaluate = 'SC = SC;'
	title = 'Estimate of storage CO2 flux'
	units = 'umol/m^2/s'
[End]

[Trace]
	variableName = 'FCH4'
	Evaluate = 'FCH4 = FCH4;'
	title = 'CH_4 Flux'
	units = 'nmol m^{-2} s^{-1}' %Check Units
[End]

[Trace]
	variableName = 'SCH4'
	Evaluate = 'SCH4 = SCH4;'
	title = 'Estimate of storage CH4 flux'
	units = 'nmol m^{-2} s^{-1}' %Check Units
[End]

[Trace]
	variableName = 'qc_co2_flux'
	Evaluate = 'qc_co2_flux = qc_co2_flux;'
	
	title = 'CO_2 Flux qc'
	units = '\mu mol m^{-2} s^{-1}'
[End]

[Trace]
	variableName = 'co2_signal_strength_7200_mean'
	Evaluate = 'co2_signal_strength_7200_mean = co2_signal_strength_7200_mean;'
	
	title = 'co2_signal_strength_7200_mean'
	units = ''
[End]

[Trace]
	variableName = 'qc_ch4_flux'
	Evaluate = 'qc_ch4_flux = qc_ch4_flux;'
	
	title = 'CH_4 Flux qc'
	units = ''
[End]

[Trace]
	variableName = 'rssi_77_mean'
	Evaluate = 'rssi_77_mean = rssi_77_mean;'
	
	title = 'rssi_77_mean'
	units = ''
[End]

[Trace]
	variableName = 'TKE'
	Evaluate = 'TKE = TKE;'
	title = 'Turbulent kinetic energy'
	units = 'm2 s-2'
[End]


[Trace]
	variableName = 'L'
	Evaluate = 'L = L;'
	title = 'Monin-Obukhov length'
	units = 'm'
[End]

[Trace]
	variableName = 'U_SIGMA'
	Evaluate = 'U_SIGMA = sqrt(u_var);'
	title = 'Standard deviation of velocity fluctuations'
	units = 'm s-1'
[End]

[Trace]
	variableName = 'V_SIGMA'
	Evaluate = 'V_SIGMA = sqrt(v_var);'
	title = 'Standard deviation of lateral velocity fluctuations'
	units = 'm s-1'
[End]

[Trace]
	variableName = 'W_SIGMA'
	Evaluate = 'W_SIGMA = sqrt(w_var);'
	title = 'Standard deviation of vertical velocity fluctuations'
	units = 'm s-1'
[End]

[Trace]
	variableName = 'TAU'
	Evaluate = 'TAU = TAU;'
	title = 'Corrected momentum flux'
	units = 'kg m-1 s-2'
[End]

[Trace]
	variableName = 'zdL'
	Evaluate = 'zdL = zdL;'
	title = 'Monin-Obukhov stability parameter. EddyPro output name: (z-d)/L'
	units = 'dimensionless'
[End]

[Trace]
	variableName = 'T_SONIC'
	Evaluate = 'T_SONIC = T_SONIC;'
	title = 'Mean temperature of ambient air as measured by the anemometer'
	units = 'C'
[End]


% ----------------------------------------------------------------------------
% Misc Meteorological variables
% ----------------------------------------------------------------------------


[Trace]
	variableName = 'aerodynamic_resistance_momentum'
	Evaluate = '[ga_m_vel, ga_h_vel] = calc_aerodynamic_conductance(WS_1_1_1,USTAR,zdL);
                    aerodynamic_resistance_momentum = 1./ga_m_vel;'
	title = 'Aerodynamic resistance for momentum'
	units = 's m^{-1}'
[End]

[Trace]
	variableName = 'aerodynamic_resistance_scalar'
	Evaluate = '[ga_m_vel, ga_h_vel] = calc_aerodynamic_conductance(WS_1_1_1,USTAR,zdL);
                    aerodynamic_resistance_scalar = 1./ga_h_vel;'
	title = 'Aerodynamic resistance for heat and water vapour'
	units = 's m^{-1}'
[End]

[Trace]
	variableName = 'surface_conductance'
	Evaluate = 'available_energy = (NETRAD_1_1_1 - G_1); % could better estimate storage terms for G
		    surface_conductance = calc_surface_conductance_as_flx(TA_F_1_1_1,...
			    RH_F_1_1_1, aerodynamic_resistance_scalar, available_energy,...
                            LE, PA_F_1_1_1);'
	title = 'Surface conductance'
	units = 'mol m^{-2} s^{-1}'
[End]
