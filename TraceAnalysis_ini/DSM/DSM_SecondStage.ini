% Revisions:
%
% May 11, 2026 (Karolina)
%   -  Edited gap filled variables to have correct Ameriflux formatting (e.g. TA_F_1_1_1 instead of TA_1_1_1_F). 
%   -  See bottom of webpage: https://ameriflux.lbl.gov/data/aboutdata/data-variables/
%
% Mar 23, 2026 (Rosie)
%	- Added documentation and links to LWoutCorrection.m (matlab function in Derived_Variables) to explain this correction
%	  and how it was derived.
%
% Mar 6, 2026 (Rosie)
%	- Removed soil heat flux recalculations for mid-2021 since all met data before September 2021 (flag_B4INSTAL) is 
%	  removed anyway and those measurements are not reliable. 
%
% Feb 3, 2026 (Rosie)
%	- Edited to use gapFillUsingAltSensor instead of old algorithm. 
%	  Changed qaqcIn params slightly for TA_1_2_1_F, SW_IN_1_1_1_F, PPFD_IN_1_1_1_F, and PA_1_1_1_F to allow gap-filling in all years.
%	  RH_1_1_1 and RH_1_2_1 (usually missing same data points) not gap-filled by ECCC - not good enough fit in all years,
%	  not that many data points missing (max ~200, about 1%) (test ERA5 later...)
%	- Added functions vapPressDeficit, calcNetRad, and calcAlb, for recalculating VPD, NETRAD, and 
%	  ALB respectively, to reduce clutter. Functions include application of minMax values.
%	- Removed gap-filling for VPD, since not gap-filling RH at the moment (maybe with ERA5 later...), TA and RH have same missing data points.
%	- Changed method for creating soil temperature averages.
%	- Removed gap-filled LW_IN_1_1_1_F, not good fit most years with RBM (max ~100 missing, <1%)
%
% Sep 10, 2025 (Rosie)
%	- Changed notation to be "Ameriflux-friendly": provide both non-gap-filled and gap-filled variables for AMF, 
%	  as well as gap-filled '_F' for internal/data sharing.
%	- Wind direction filtering (badWD) moved to third stage (this happened some time ago). 
% Jun 8, 2024 (Zoran)
%   - Major cleanup. Moved despiking to stage 1. 
% Feb 3, 2023 (Zoran)
%   - changed searchPath to 'auto'
% Jan 23, 2023 (Zoran)
%   - added wlen=24 and thres=4 to TA_1_1_1 otherwise these two parameters 
%     are not defined.
% Feb 1, 2024 (ziyi, copy from Ted at Hogg)
%	- create WD filter trace "badWD" to use for cleaning out fluxes when wind is disturbed by tower before sonic
%


Site_name = 'Delta Site Marsh'
SiteID = 'DSM'
input_path    = ''
output_path   = '' 
high_level_path = {}
searchPath = 'auto'
 
% Contents:
% Misc. variables
% Profiles
% Radiation
% Soil
% Turbulent fluxes
% Carbon balance terms
% Energy storage terms


% create a generic trace and variables
% the variables created here will be available to all other traces below
% and that saves some extra typing.
[Trace]
	variableName = 'all_nan'
	Evaluate = 'all_nan = nan(size(clean_tv));
                processingYear = yearIn;'
	title = 'definitions of a all_nan trace and some global variables'
	units = ''
[End]

% ----------------------------------------------------------------------------
% Temperature and relative humidity variables
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'TA_1_1_1'
	Evaluate        = 'TA_1_1_1 = TA_1_1_1;'
	title           = 'Air temperature at 350cm (HMP)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_1_2_1'
	Evaluate        = 'TA_1_2_1 = TA_1_2_1;'
	title           = 'Air temperature at 2m (HMP)'
	units           = '^oC'
[End]

% gap-filled TA
[Trace]
	variableName    = 'TA_F_1_1_1'
	Evaluate        = 'TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],[],1,"TA_F_1_1_1");'
	title           = 'Air temperature at 350cm (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_F_1_2_1'
	%Evaluate		= 'TA_1_2_1_F = gapFillUsingAltSensor(TA_1_2_1,TA_ECCC,[],[],1,"TA_1_2_1_F");'
	Evaluate        = 'qaqcIn = [];
					   qaqcIn.maxSlope = 1.06;	% default is 1.05, determined that 1.06 is justified following testing
					   TA_F_1_2_1 = gapFillUsingAltSensor(TA_1_2_1,TA_ECCC,[],qaqcIn,1,"TA_F_1_2_1");'
	title           = 'Air temperature at 2m (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

% pass through unfilled variables for Ameriflux
% Is having all_nan causing any issues/delays when submitting to Ameriflux? 
% If so, Zoran will hard-code removal of traces with all_nan (for full years).
[Trace]
	variableName    = 'RH_1_1_1'
    Evaluate        = 'if(processingYear<2025),
							RH_1_1_1 = RH_1_1_1;
					   else
					   		RH_1_1_1 = all_nan;	
					   end;'
	title           = 'RH at 350cm (HMP)'
	warnings 		= 'no good substitute RH data yet, test ERA5 later after 2025 Ameriflux submission'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_1_2_1'
    Evaluate        = 'RH_1_2_1 = RH_1_2_1;'
	title           = 'RH at 2m (HMP)'
	warnings 		= 'no good substitute RH data yet, test ERA5 later after 2025 Ameriflux submission'
	units           = '%'
[End]

