% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName    = 'VPD_1_1_1'
	Evaluate 		= 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 350cm HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_1_2_1'
	Evaluate 		= 'VPD_1_2_1 = vapPressDeficit(TA_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 2m HMP)'
	units           = 'hPa'
[End]

% gap-filled VPD:
% not worth doing this as TA and RH are essentially missing same data points in each year and RH not gap-filled

[Trace]
	variableName    = 'TS_1'
	Evaluate 		= 'TS_1 = mean([TS_1_1_1,TS_2_1_1],2,"omitnan");'
	title           = 'average soil temperature at 5cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_2'
	Evaluate 		= 'TS_2 = mean([TS_1_2_1,TS_2_2_1],2,"omitnan");'
	title           = 'average soil temperature at 10cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_3'
	Evaluate 		= 'TS_3 = mean([TS_1_3_1,TS_2_3_1],2,"omitnan");'
	title           = 'average soil temperature at 20cm depth'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TS_4'
	Evaluate 		= 'TS_4 = mean([TS_1_4_1,TS_2_4_1],2,"omitnan");'
	title           = 'average soil temperature at 50cm depth'
	units           = '^oC'
[End]

% might need to create separate function for G_1: hardcoded slopes and offsets not the best,
% plus they could change if data cleaning changes
%---> No longer relevant - data before September 9th 2021 is removed from database anyway: deleted old and complex Evaluate statement (Rosie, March 2026)
[Trace]
	variableName    = 'G_1'
	Evaluate        = 'G_1 = mean([G_1_1_1, G_2_1_1, G_3_1_1],2,"omitnan");'
	title           = 'soil heat flux at 5cm depth'
	units           = '∞C'
[End]

% ----------------------------------------------------------------------------
% Radiation variables
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'SW_IN_1_1_1'
	Evaluate        = 'SW_IN_1_1_1 = SW_IN_1_1_1;'
	title           = 'incoming shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

% gap-filled SW_IN
% No subsitute RBM data until 2022, gap-fill 2021 with ERA5? Test later...
[Trace]
	variableName    = 'SW_IN_F_1_1_1'
	Evaluate        = 'if(processingYear>2021),
						qaqcIn = [];
					    qaqcIn.r2min = 0.93;		% default is 0.95, decided 0.93 is justified in this case
					    SW_IN_F_1_1_1 = gapFillUsingAltSensor(SW_IN_1_1_1,RBM_SW_IN_1_1_1,[],qaqcIn	,1,"SW_IN_F_1_1_1");
					   else
					    SW_IN_F_1_1_1 = SW_IN_1_1_1;	% used in third stage so need to provide data
					   end;'
	title           = 'incoming shortwave radiation by CNR4 gap-filled using RBM'
	warnings 		= 'test 2021 SW_IN ERA5 data after Ameriflux submission'
	units           = 'W/m^2'
[End]

% test ERA5 - issue with being out of phase after first stage - checked with Paul. REVISIT later, please leave commented out code for now
%[Trace]
%	variableName    = 'SW_IN_1_1_1_ERA5_F'
%	Evaluate        = 'SW_IN_1_1_1_ERA5_F = gapFillUsingAltSensor(SW_IN_1_1_1,SW_IN_ERA5,[],[],1,"SW_IN_1_1_1_FwithERA5");'
%	title           = 'incoming shortwave radiation by CNR4 gap-filled using RBM'
%	units           = 'W/m^2'
%[End]

[Trace]
	variableName    = 'SW_OUT_1_1_1'
	Evaluate        = 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'
	title           = 'reflected shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'LW_IN_1_1_1'
	Evaluate        = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title           = 'incoming long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

% gap-filled LW_IN
% Removed gap-filled LW_IN, not good fit most years with RBM (max ~100 missing, <1%)

% load RBM data used in LWoutCorrection
[Trace]
	variableName 	= 'RBM_NETRAD_1_1_1'
	Evaluate 		= 'if(processingYear>2021),
						RBM_NETRAD_1_1_1 = RBM_NETRAD_1_1_1;
					   else
					    RBM_NETRAD_1_1_1 = all_nan;		% no RBM data in 2021
					   end;'
	title 			= 'net radiation by CNR4 from RBM'
	units 			= 'W/m^2'
[End]

[Trace]
	variableName 	= 'RBM_LW_OUT_1_1_1'
	Evaluate 		= 'if(processingYear>2021),
						RBM_LW_OUT_1_1_1 = RBM_LW_OUT_1_1_1;
					   else
					   	RBM_LW_OUT_1_1_1 = all_nan;		% no RBM data in 2021
					   end;'
	title 			= 'outgoing longwave radiation from RBM'
	units 			= 'W/m^2'
[End]

[Trace]
	variableName    = 'LW_OUT_1_1_1'
	Evaluate        = 'LW_OUT_1_1_1 = LW_OUT_1_1_1;
							LWoutCorrection;'	% see comment at top of page (Mar 23, 2026) plus comments in first stage INI
	title           = 'outgoing long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

% RG is not an Ameriflux variable
[Trace]
	variableName    = 'RG_1_1_1'
	Evaluate        = 'RG_1_1_1 = SW_IN_1_1_1 + LW_IN_1_1_1;'
	title           = 'Global Radiation - total incoming SW + LW'
	units           = 'W/m^2'
[End]

[Trace]
	variableName    = 'RG_F_1_1_1'
	Evaluate        = 'if(processingYear<2022),
							RG_F_1_1_1 = RG_1_1_1;		% no substitute SW_IN data (yet, test ERA5 later)
					   else
					   		RG_F_1_1_1 = SW_IN_F_1_1_1 + LW_IN_1_1_1;
					   end;'
	title           = 'Global Radiation - total incoming SW (gap-filled) & LW'
	units           = 'W/m^2'
[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName 	= 'ALB_1_1_1'
	Evaluate 		= 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);' 
	title 			= 'albedo by CNR4'
	units 			= '%'
[End]

% gap-filled ALB
[Trace]
	variableName 	= 'ALB_F_1_1_1'
	Evaluate 		= 'if(processingYear<2022),
						  ALB_F_1_1_1 = ALB_1_1_1;	% no substitute SW_IN data (yet, test ERA5 after 2025 Ameriflux submission)
					   else
					      ALB_F_1_1_1 = calcAlb(SW_IN_F_1_1_1,SW_OUT_1_1_1);
					   end;'
	title 			= 'albedo by CNR4 using SW_IN gap-filled with RBM data'
	warnings 		= 'no substitute SW_IN data for 2021 (yet, test ERA5 later after 2025 Ameriflux submission)'
	units 			= '%'
[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName 	= 'NETRAD_1_1_1'
	Evaluate 		= 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title 			= 'net radiation by CNR4'
	units 			= 'W/m^2'
[End]

% gap-filled NETRAD
[Trace]
	variableName 	= 'NETRAD_F_1_1_1'
	Evaluate 		= 'if(processingYear<2022),
							NETRAD_F_1_1_1 = NETRAD_1_1_1;
					   else
					   		NETRAD_F_1_1_1 = calcNetRad(SW_IN_F_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);
					   end;'
	title 			= 'net radiation by CNR4 using SW_IN (gap-filled by RBM) and LW_IN'
	units 			= 'W/m^2'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'PPFD_IN_1_1_1'
	Evaluate        = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title           = 'incoming PAR'
	units           = '\mu mol/m^2/s'
[End]

% gap-filled PPFD_IN
[Trace]
	variableName    = 'PPFD_IN_F_1_1_1'
	Evaluate        = 'if(processingYear>2021),
						qaqcIn = [];
					   	qaqcIn.r2min = 0.94;		% default is 0.95, determined 0.94 is justified after testing
					   	PPFD_IN_F_1_1_1 = gapFillUsingAltSensor(PPFD_IN_1_1_1,RBM_PPFD_IN_1_1_1,[],qaqcIn,1,"PPFD_IN_F_1_1_1");
					   else
					    PPFD_IN_F_1_1_1 = PPFD_IN_1_1_1;
					   end;'
	title           = 'incoming PAR gap-filled using RBM data'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName    = 'PPFD_OUT_1_1_1'
	Evaluate        = 'PPFD_OUT_1_1_1 = PPFD_OUT_1_1_1;'
	title           = 'reflected PAR'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName    = 'PPFD_IN_2_1_1'
	Evaluate        = 'PPFD_IN_2_1_1 = PPFD_IN_2_1_1;'	
	title           = 'incoming PAR measured by BF5'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName    = 'PPFD_DIF_1_1_1'
	Evaluate        = 'PPFD_DIF_1_1_1 = PPFD_DIF_1_1_1;'
	title           = 'diffuse PAR measured by BF5'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName    = 'PRI_1_1_1'
	Evaluate        = 'PRI_1_1_1 = PRI_1_1_1;'
	title           = 'Photochemical reflectance index'
	units           = 'nondimensional'
[End]

[Trace]
	variableName    = 'NDVI_1_1_1'
	Evaluate        = 'NDVI_1_1_1 = NDVI_1_1_1;'
	title           = 'Normalized difference vegetation index'
	units           = 'nondimensional'
[End]

% ----------------------------------------------------------------------------
% Pressure and precipitation variables
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'PA_1_1_1'
	Evaluate        = 'PA_1_1_1 = PA_1_1_1;'
	title           = 'air pressure by CS106 installed in the logger box'
	units           = 'kPa'
[End]

% gap-filled PA
[Trace]
	variableName    = 'PA_F_1_1_1'
	Evaluate 		= 'qaqcIn = [];
					   qaqcIn.r2min = 0.93;		% determined after testing
    				   PA_F_1_1_1 = gapFillUsingAltSensor(PA_1_1_1,PA_ECCC,[],qaqcIn,1,"PA_F_1_1_1");'
	title           = 'air pressure by CS106 installed in the logger box, gap-filled using ECCC climate station data'
	units           = 'kPa' 
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'P_1_1_1'
	Evaluate        = 'P_1_1_1 = P_1_1_1;'
	title           = 'precipitation at 1.05m height'
	units           = 'mm'
[End]

% gap-filled P
% Removed gap-filled P, not good fit for all years with ECCC (max ~100 missing, <1%)
% Try ERA5 later? After 2025 Ameriflux submission.

