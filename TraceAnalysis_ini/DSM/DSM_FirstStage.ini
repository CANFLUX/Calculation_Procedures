% DSM First Stage INI file
%
% File created:      20220404 S Knox
% File modified:     20240603 Zoran

% Revisions:
%
% 10 March 2026 (Rosie)
%    - Turns out we do not need the shiftMyData function because met data is sourced from CR1000 logger, not Smartflux
%      where the original issue was. Removed all occurrences of this. See details on Teams (ECOFLUX_Group - General/Projects/2021-DSM Delta Salt Marsh/Field log, 
%      checklist & tower documentation/DSM_inifile_clarification_20260306.pptx
%      https://mcgill.sharepoint.com/:p:/r/sites/MicrometLab_Group2/Shared%20Documents/General/Projects/2021-DSM%20Delta%20Salt%20Marsh/Field%20log,%20checklist%20%26%20tower%20documentation/DSM_inifile_clarification_20260306.pptx?d=w3b5cea4aadd14b67a48901e3283e29d8&csf=1&web=1&e=SPtzwj)
%    - Moved run_std_dev function (where used) to postEvaluate so operation happens last (after Evaluate, minMax, calibrations, etc.)
%
% 4 March 2026 (Rosie)
%    - Incorporated generalized time shift function shiftMyData (adapted from site-specific versions and added to Biomet),
%      applies to met variables From the DSM site-specific time shift function (Tzu-Yi): 
%         "Due to a wrong setting of 'DataInterval' in the CR1000 program at DSM, 
%         (we set it as 30 min at the beginning, but it should be 60sec)
%         the timestamps during this period in BIOMET table were lagged by 30min."
%
% 6 Feb 2026 (Rosie)
%    - Removed the Flux WS_1_1_1 and WD_1_1_1 (i.e. the ones loaded from flux folder). 
%      These are from RM Young sent to datalogger and have lower sampling rate than 
%      MET_Young_WS_WVc1 (RM Young). Kept wind_speed (sonic) and MET_Young_WS_WVc1 (RM Young)
%      (gap-fill sonic (high accuracy) with RM Young in second stage) - this needs more testing, no WS/WD gap-filling yet.
%    - Note that ECCC data is loaded using include file (station ID 925).
%    - RH_1_1_1 sensor N4520546 stopped working end of July 2024, new sensor installed soon (3 Feb 2026).
%
% 3 February 2026 (Rosie)
%    - Added flag_Spikes to remove persistent bad spikes in 2024 for TA_1_1_1, TA_1_2_1, and all TS_ variables (occurring at same times for each).
%      Spike removal algorithms removed too much good data and minMax did not catch summer spikes,
%      reluctant to change minMax. No obvious diagnostic variable to help filter.
%
% 2 February 2026 (Rosie)
%    - Revisited spike removal:
%         - Removed spike filtering for TA_1_1_1, TA_1_2_1, RH_1_1_1, RH_1_2_1 (removing too many good points, gained these back)
%           and for PA_1_1_1, not necessary, minMax removes bad spikes.
%         - Tested spike filtering (both run_std_dev and remove_spikes_diurnal_nonParametric) for all TS_ and all G_ variables,
%           worth using run_std_dev as removes multiple true spikes (in addition to minMax) only at the expense of a couple of false positives.
%         - Tested spike filtering for COND_WATER_1_1_1, WTD_1_1_1, ORP_1_1_1, pH_1_1_1, and TW_1_1_1: 
%           worth keeping run_std_dev, does decent job of removing lots of big spikes.
%    - Duplicated minMax and clamped_minMax values from RAD_FirstStage_include.ini for RBM_SW_IN_1_1_1 (used for gap-filling). 
%
% 10 September 2025 (Rosie)
%    - Changed spike-filter to be remove_spikes_diurnal_nonParametric for TA_1_1_1 and TA_1_2_1 
%      (run_std_dev was not removing some obvious spikes)
% 9 September 2025 (Rosie)
%    - Switched height order for TA and RH, since Ameriflux requires upper-most air measurements to be e.g. TA_1_1_1, 
%      then second highest TA_1_2_1, etc. These were the wrong way round in earlier versions of the file. 


Site_name = 'Delta Site Marsh'
SiteID = 'DSM'

Difference_GMT_to_local_time = 8    % hours (GMT - PST)
Timezone = 8                        % hours
% if Timezone == 0 then the database is in UTC/GMT 
% if Timezone == Difference_GMT_to_local_time then the database is in ST
% having the offset positive when it should be negative (after all PST = GMT - 8)
% is a legacy issue that (hopefully) will be sorted out at some point in the future.

