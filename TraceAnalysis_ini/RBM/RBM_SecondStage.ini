%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Second stage ini_file for RBM
%
% May, 2022 Sara Knox
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% Revisions
%
% May 11, 2026 (Karolina)
%   -  Edited gap filled variables to have correct Ameriflux formatting (e.g. TA_F_1_1_1 instead of TA_1_1_1_F). 
%   -  See bottom of webpage: https://ameriflux.lbl.gov/data/aboutdata/data-variables/
%
% Mar 10, 2026 (Rosie)
% 	- Edited to use gapFillUsingAltSensor instead of old algorithm:      
%		- Changed qaqcIn params slightly for TA_1_1_1_F, TA_1_2_1_F, SW_IN_1_1_1_F, PPFD_IN_1_1_1_F... following testing/plotting to justify.
%	  	- RH_1_1_1 and RH_1_2_1 (usually missing same data points) not gap-filled by ECCC - not good enough fit in all years,
%	    	hardly any data points missing (max ~16, <0.1%) (test ERA5 later...)	
%	- Added functions vapPressDeficit, calcNetRad, and calcAlb, for recalculating VPD, NETRAD, and 
%	  ALB respectively, to reduce clutter. Functions include application of minMax values.
%	- Changed method for creating soil temperature averages.
%	- Removed gap-filled LW_IN_1_1_1_F, not good fit most years with RBM (max ~100 missing, <1%)
%
% Nov 5, 2025 (Rosie)
%	- Changed notation to be "Ameriflux-friendly": provide both non-gap-filled and gap-filled variables for AMF, 
%	  as well as gap-filled '_F' for internal/data sharing.
%	- Use variables with 1_2_1 suffixes as input to third stage config as closest in height to flux measurements.
%
% Mar 24, 2025 (Rosie)
%	- Added NETRAD and ALB calculations back to second stage (removed from first stage RAD include file) on principle, 
%	  because they are "modelled" not measured.
% Nov 29, 2024 (Rosie)
%	- Removed NEE from second stage, per database meeting on 27 Nov 2024 
%		NEE is calculated in third stage.
% 	- Moved "badWD" trace to first stage, and applied "tag_EC_fluxes" there,
%		now Evaluate feature is available in first stage.
% Nov 12, 2024 (Rosie)
%	- Moved run_std_dev to first stage.
% 	- Cleaned up, removing obsolete parameters (minMax, originalVariable, etc.)
%	- Changed wind_speed from CSAT3 (Flux variable) to have standardized name WS, 
%		in line with EddyPro_Common_FirstStage_include file.
% May 21, 2024 (Zoran)
%   - Replaced:
%		badWD = find(WD_1_1_1 >= lower | WD_1_1_1 <= upper);
%     with:
%   	badWD = (WD_1_1_1 >= lower | WD_1_1_1 <= upper);
%	  to avoid having a trace badWD that is not of a full length. 
%     The original line would return < 17,520 points.
% Feb 3, 2023 (Zoran)
%  - changed searchPath = 'low_level,current' 
%    to: searchPath = 'auto'
% Feb 1, 2024 (ziyi, copy from Ted at Hogg)
%	- create WD filter trace "badWD" to use for cleaning out fluxes when wind is disturbed by tower before sonic


Site_name = 'Richmond Brackish Marsh'
SiteID = 'RBM'
input_path    = ''
output_path   = '/Users/ziyi/MicrometLab/local_database/yyyy/RBM/clean/SecondStage/' 
high_level_path = {}
searchPath = 'auto'

% Contents:
% Misc. variables
% Profiles
% Radiation
% Soil
% Turbulent fluxes
% Carbon balance terms
% Energy storage terms

% ----------------------------------------------------------------------------
% Misc. important variables - temperature, pressure etc. 
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'TA_1_1_1'
	Evaluate        = 'TA_1_1_1 = TA_1_1_1;'
	title           = 'Air temperature at 6m (HMP)'
	units           = '^oC'
[End]

[Trace]
	variableName    = 'TA_1_2_1'
	Evaluate        = 'TA_1_2_1 = TA_1_2_1;'
	title           = 'Air temperature at 4m (HMP)'
	units           = '^oC'
[End]

% gap-filled TA
[Trace]
	variableName 	= 'TA_F_1_1_1'
	Evaluate        = 'qaqcIn = [];
					   qaqcIn.minSlope = 0.92;	% determined this is OK after testing/plotting
					   TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],qaqcIn,1,"TA_F_1_1_1");'
	title 			= 'Air temperature at 6m (HMP) gap-filled using ECCC climate station data'
	units 			= '^oC'
[End]

[Trace]
	variableName    = 'TA_F_1_2_1'
	Evaluate        = 'qaqcIn = [];
					   qaqcIn.minSlope = 0.935;	% determined this is OK after testing/plotting
					   TA_F_1_2_1 = gapFillUsingAltSensor(TA_1_2_1,TA_ECCC,[],qaqcIn,1,"TA_F_1_2_1");'
	title           = 'Air temperature at 4m (HMP) gap-filled using ECCC climate station data'
	units           = '^oC'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'RH_1_1_1'
    Evaluate        = 'RH_1_1_1 = RH_1_1_1;'
	title           = 'RH at 6m (HMP)'
	warnings 		= 'no good substitute RH data yet, test ERA5 later after 2025 Ameriflux submission'
	units           = '%'
[End]

[Trace]
	variableName    = 'RH_1_2_1'
    Evaluate        = 'RH_1_2_1 = RH_1_2_1;'
	title           = 'RH at 4m (HMP)'
	warnings 		= 'no good substitute RH data yet, test ERA5 later after 2025 Ameriflux submission'
	units           = '%'
[End]

% Please leave commented out code for now as may be used later with ERA5 data.
% gap-filled RH
% no gap-filling for RH, ECCC is not a good match.
%[Trace]
%	variableName 	= 'RH_1_1_1_F'
%	Evaluate 		= 'qaqc=[];
%                	   qaqc.polyfitWithoutClamped = 2;
%                	   qaqc.gapfillOverwrite = false;
%                	   qaqc.clamped_minMax = [0,100];
%					   RH_1_1_1_F = gapFillUsingAltSensor(RH_1_1_1,RH_ECCC,[],qaqcIn,1,"RH_1_1_1_F");'
%	title 			= 'RH at 6m (HMP) gap-filled using ECCC climate station data'
%	units 			= '%'
%[End]

%[Trace]
%	variableName 	= 'RH_1_2_1_F'
%	Evaluate 		= 'qaqc=[];
%                	   qaqc.polyfitWithoutClamped = 2;
%                	   qaqc.gapfillOverwrite = false;
%                	   qaqc.clamped_minMax = [0,100];
%					   RH_1_2_1_F = gapFillUsingAltSensor(RH_1_2_1,RH_ECCC,[],qaqcIn,1,"RH_1_2_1_F");'
%	title 			= 'RH at 4m (HMP) gap-filled using ECCC climate station data'
%	units 			= '%'
%[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName    = 'VPD_1_1_1'
	Evaluate 		= 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 6m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_1_2_1'
	Evaluate 		= 'VPD_1_2_1 = vapPressDeficit(TA_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 4m HMP)'
	units           = 'hPa'
[End]

% gap-filled VPD
[Trace]
	variableName    = 'VPD_F_1_1_1'
	Evaluate 		= 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 6m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_F_1_2_1'
	Evaluate 		= 'VPD_F_1_2_1 = vapPressDeficit(TA_F_1_2_1,RH_1_2_1);'
	title           = 'Vapour pressure deficit (from 4m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName 	= 'TS_1'
	Evaluate 		= 'TS_1 = mean([TS_1_1_1,TS_2_1_1],2,"omitnan");'
	title 			= 'average soil temperature at 5cm depth'
	units	 		= '^oC'
[End]

[Trace]
	variableName 	= 'TS_2'
	Evaluate 		= 'TS_2 = mean([TS_1_2_1,TS_2_2_1],2,"omitnan");'
	title 			= 'average soil temperature at 10cm depth'
	units 			= '^oC'
[End]

[Trace]
	variableName 	= 'TS_3'
	Evaluate 		= 'TS_3 = mean([TS_1_3_1,TS_2_3_1],2,"omitnan");'
	title 			= 'average soil temperature at 20cm depth'
	units 			= '^oC'
[End]

[Trace]
	variableName 	= 'TS_4'
	Evaluate 		= 'TS_4 = mean([TS_1_4_1,TS_2_4_1],2,"omitnan");'
	title 			= 'average soil temperature at 50cm depth'
	units 			= '^oC'
[End]

[Trace]
	variableName 	= 'G_1'
	Evaluate 		= 'G_1 = mean([G_1_1_1, G_2_1_1, G_3_1_1],2,"omitnan");'
	title 			= 'soil heat flux at 5cm depth'
	units 			= '°C'
[End]

% ----------------------------------------------------------------------------
% Radiation variables
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'SW_IN_1_1_1'
	Evaluate        = 'SW_IN_1_1_1 = SW_IN_1_1_1;'
	title           = 'incoming shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

% gap-filled SW_IN
[Trace]
	variableName 	= 'SW_IN_F_1_1_1'
	Evaluate		= 'qaqcIn = [];
					   qaqcIn.r2min = 0.93;		% determined after testing
					   SW_IN_F_1_1_1 = gapFillUsingAltSensor(SW_IN_1_1_1,DSM_SW_IN_1_1_1,[],qaqcIn,1,"SW_IN_F_1_1_1");'
	title 			= 'incoming shortwave radiation by CNR4 gap-filled using DSM'
	units 			= 'W/m^2'
[End]

[Trace]
	variableName 	= 'SW_OUT_1_1_1'
	Evaluate 		= 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'
	title 			= 'reflected shortwave radiation by CNR4'
	units 			= 'W/m^2'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'LW_IN_1_1_1'
	Evaluate        = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title           = 'incoming long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

% gap-filled LW_IN
% Removed gap-filled LW_IN, not good fit most years with DSM (max ~100 missing, <1%)

[Trace]
	variableName 	= 'LW_OUT_1_1_1'
	Evaluate 		= 'LW_OUT_1_1_1 = LW_OUT_1_1_1;'
	title 			= 'outgoing long wave radiation by CNR4'
	units 			= 'W/m^2'
[End]

% RG is not an Ameriflux variable
[Trace]
	variableName    = 'RG_F_1_1_1'
	Evaluate        = 'RG_F_1_1_1 = SW_IN_F_1_1_1 + LW_IN_1_1_1;'
	title           = 'Global Radiation - total incoming SW (gap-filled) & LW'
	units           = 'W/m^2'
[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName 	= 'ALB_1_1_1'
	Evaluate 		= 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);' 
	title 			= 'albedo by CNR4'
	units 			= '%'
[End]

% gap-filled ALB
[Trace]
	variableName 	= 'ALB_F_1_1_1'
	Evaluate 		= 'ALB_F_1_1_1 = calcAlb(SW_IN_F_1_1_1,SW_OUT_1_1_1);' 
	title 			= 'albedo by CNR4 using SW_IN gap-filled with DSM data'
	units 			= '%'
[End]

% pass through/derive unfilled variables for Ameriflux
[Trace]
	variableName 	= 'NETRAD_1_1_1'
	Evaluate 		= 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title 			= 'net radiation by CNR4'
	units 			= 'W/m^2'
[End]

% gap-filled NETRAD
[Trace]
	variableName 	= 'NETRAD_F_1_1_1'
	Evaluate 		= 'NETRAD_F_1_1_1 = calcNetRad(SW_IN_F_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title 			= 'net radiation by CNR4 using SW_IN (gap-filled by DSM) and LW_IN'
	units 			= 'W/m^2'
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'PPFD_IN_1_1_1'
	Evaluate        = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title           = 'incoming PAR'
	units           = '\mu mol/m^2/s'
[End]

% gap-filled PPFD_IN
[Trace]
	variableName    = 'PPFD_IN_F_1_1_1'
	Evaluate        = 'qaqcIn = [];
					   qaqcIn.r2min = 0.94;		% default is 0.95, determined 0.94 is justified after testing
					   PPFD_IN_F_1_1_1 = gapFillUsingAltSensor(PPFD_IN_1_1_1,DSM_PPFD_IN_1_1_1,[],qaqcIn,1,"PPFD_IN_F_1_1_1");;'
	title           = 'incoming PAR gap-filled using DSM data'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName 	= 'PPFD_OUT_1_1_1'
	Evaluate 		= 'PPFD_OUT_1_1_1=PPFD_OUT_1_1_1;'
	title 			= 'reflected PAR'
	units 			= '\mu mol/m^2/s'
[End]

[Trace]
	variableName 	= 'PPFD_IN_2_1_1'
	Evaluate 		= 'PPFD_IN_2_1_1 = PPFD_IN_2_1_1;'		
	title 			= 'incoming PAR measured by BF5'
	units 			= '\mu mol/m^2/s'
[End]

[Trace]
	variableName 	= 'PPFD_DIF_1_1_1'
	Evaluate 		= 'PPFD_DIF_1_1_1 = PPFD_DIF_1_1_1;'
	title 			= 'diffuse PAR measured by BF5'
	units 			= '\mu mol/m^2/s'
[End]

[Trace]
	variableName 	= 'PRI_1_1_1'
	Evaluate 		= 'PRI_1_1_1 = PRI_1_1_1;'
	title 			= 'Photochemical reflectance index'
	units 			= 'nondimensional'
[End]

[Trace]
	variableName 	= 'NDVI_1_1_1'
	Evaluate 		= 'NDVI_1_1_1 = NDVI_1_1_1;'
	title 			= 'Normalized difference vegetation index'
	units 			= 'nondimensional'
[End]

% ----------------------------------------------------------------------------
% Pressure and precipitation variables
% ----------------------------------------------------------------------------

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'PA_1_1_1'
	Evaluate        = 'PA_1_1_1 = PA_1_1_1;'
	title           = 'air pressure by CS106 installed in the logger box'
	units           = 'kPa'
[End]

% gap-filled PA
[Trace]
	variableName 	= 'PA_F_1_1_1'
	Evaluate 		= 'PA_F_1_1_1 = gapFillUsingAltSensor(PA_1_1_1,PA_ECCC,[],[],1,"PA_F_1_1_1");'
	title 			= 'air pressure by CS106 installed in the logger box, gap-filled using ECCC climate station data'
	units 			= 'kPa' 
[End]

% pass through unfilled variables for Ameriflux
[Trace]
	variableName    = 'P_1_1_1'
	Evaluate        = 'P_1_1_1 = P_1_1_1;'
	title           = 'precipitation at 1.05m height'
	units           = 'mm'
[End]

% gap-filled P
% Removed gap-filled P, not good fit for all years with ECCC (max ~16 missing, <0.1%)


