%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Second stage ini_file for HOGG
%
% May, 2022 Sara Knox
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%
% Revisions:
%
% Aug 31, 2026 *(Rosie)
%	- relaxed minSlope threshold for SW_IN gap-filling very slightly to allow 2021 data to be gap-filled.
%
% Jul 16, 2026 (Joyson)
%	- removed gap-filling for P, WS, and WD: alternative station data not good enough fit. as per Rosie Young ini file
% May 21, 2026 (Joyson)
%	- changed gapfilled name to F_1_1_1 using Zoran code
%
% Apr 02, 2026 (Joyson)
%	-updated based on Rosie example ini file
%	- changed calc_avg_trace to gapFillUsingAltSensor
%
% FEB 18, 2025 (Joyson)
%	- updated from Young_SecondStage.ini created by Rosie
%	- moved all "shiftMyData"
%
% March 28, 2024 (Joyson)
%	- change the net radiation calculation (NETRAD_1_1_1) using NETRAD = SWIN - SWOUT + LWIN - LWOUT
%
% Jan 15, 2024 (Ted)
%	- add Evapotranspiration (ET) using LE and Latent_heat_vaporization biomet function
%
% Oct 17, 2023 (Ted)
%	- added NEE to align with YOUNG
%
% Mar 24, 2023 (Darian)
% 	- Added shiftMyData (adapted from Tzu-Yi Lu DSM site) to correct for daylight savings 60 min offset.
% 	- For future: Apply 60 min offset from siteStart to 2021 Nov 7 3:00:00 in EddyPro processing 
% 	  so raw files in database are also corrected.

	


Site_name = 'Hogg Marsh'
SiteID = 'HOGG'
input_path    = ''
output_path   = '' 
high_level_path = {}
searchPath = 'auto'

% ---------------------------------------------------------------------------------------
% Create a generic trace and variables if needed
% Variables created here will be available to all other traces below saving extra typing
% ---------------------------------------------------------------------------------------
% all_nan and processingYear are useful for handling missing data, if relevant
[Trace]
	variableName = 'all_nan'
	Evaluate = 'all_nan = nan(size(clean_tv));
                processingYear = yearIn;'
	title = 'define all_nan trace and other global variables'
	units = ''
[End]

% Contents:
% Misc. variables
% Profiles
% Radiation
% Soil
% Turbulent fluxes
% Carbon balance terms
% Energy storage terms


% ----------------------------------------------------------------------------
% Temperature and relative humidity variables
% ----------------------------------------------------------------------------

% pass through unfilled TA for Ameriflux
[Trace]
	variableName    = 'TA_1_1_1'
	Evaluate        = 'TA_1_1_1 = TA_1_1_1;'
	title           = 'Air temperature at 4m (HMP)'
	units           = '^oC'
[End]

% gap-filled TA
% Example: here the verbose flag in gapFillUsingAltSensor function is set to '1' 
% for testing purposes, to output helpful statistics. 
% Can set to '[]' or '0' (default) when testing is complete

[Trace]
	variableName = 'TA_F_1_1_1'
	Evaluate = 'TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_Newdale,[],[],1,"TA_F_1_1_1");
				TA_F_1_1_1 = gapFillUsingAltSensor(TA_F_1_1_1,Young_TA_1_1_1,[],[],1,"TA_F_1_1_1");
				TA_F_1_1_1 = gapFillUsingAltSensor(TA_F_1_1_1,TA_ECCC,[],[],1,"TA_F_1_1_1");'
	title = 'Air temperature at 4m (HMP)'
	units = '^oC'
[End]



% pass through unfilled RH for Ameriflux
% Example of using processingYear and all_nan for handling missing data
[Trace]
	variableName    = 'RH_1_1_1'
    Evaluate        = 'RH_1_1_1 = RH_1_1_1;'			   
	title           = 'RH at 4 m (HMP)'
	units           = '%'
[End]

[Trace]
	variableName 	= 'RH_F_1_1_1'
	Evaluate 		= 'qaqcIn = [];
					   qaqcIn.polyfitWithoutClamped = 2;
                	   qaqcIn.clamped_minMax = [0,100];
					   qaqcIn.r2min = 0.90;		% default is 0.95, determined 0.90 is justified in this case following testing
					   RH_F_1_1_1 = gapFillUsingAltSensor(RH_1_1_1,RH_Newdale,[],qaqcIn,1,"RH_F_1_1_1");' 
	title 			= 'RH at 4m (HMP)'
	units 			= '%'
[End]

% pass through/derive unfilled VPD for Ameriflux
% example of using vapPressDeficit function
[Trace]
	variableName    = 'VPD_1_1_1'
	Evaluate 		= 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title           = 'Vapour pressure deficit (from 4m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_F_1_1_1'
	Evaluate 		= 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_F_1_1_1);'
	title           = 'Vapour pressure deficit (from 4m HMP)'
	units           = 'hPa'
[End]

% ----------------------------------------------------------------------------
% Soil temperature, heat flux, and moisture
% ----------------------------------------------------------------------------

[Trace]
	variableName = 'TS_1'
	Evaluate = 'TS_1 = TS_1_1_1;'
	title = 'average soil temperature at 10cm below soil-water interface'
	units = '^oC'
[End]

[Trace]
	variableName = 'TS_2'
	Evaluate = 'TS_2 = TS_2_1_1;'
	title = 'average soil temperature at 10cm above soil-water interface'
	units = '^oC'
[End]

[Trace]
	variableName = 'TS_3'
	Evaluate = 'TS_3 = TS_3_1_1;'
	title = 'average soil temperature at 40cm above soil-water interface'
	units = '^oC'
[End]

% ----------------------------------------------------------------------------
% Radiation variables
% ----------------------------------------------------------------------------

% pass through unfilled SW_IN for Ameriflux
[Trace]
	variableName    = 'SW_IN_1_1_1'
	Evaluate        = 'SW_IN_1_1_1 = SW_IN_1_1_1;'
	title           = 'incoming shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName = 'SW_IN_F_1_1_1'
	Evaluate = 'qaqcIn = [];
				qaqcIn.maxSlope = 1.12;	% default is 1.05, determined 1.10 is justified in this case following testing
				qaqcIn.minSlope = 0.86;	% default is 0.95, determined 0.86 is justified following testing
				qaqcIn.r2min = 0.90;		% default is 0.95, determined 0.90 is justified in this case following testing
				SW_IN_F_1_1_1 = gapFillUsingAltSensor(SW_IN_1_1_1,Newdale_SW_IN_1_1_1,[],[qaqcIn],1,"SW_IN_F_1_1_1");'
				 %Hogg as backup - add this if you want to add Young as backup gapFillUsingAltSensor(SW_IN_1_1_1_F,Young_SW_IN_1_1_1,[],[],1,"SW_IN_1_1_1_F");
	title = 'incoming shortwave radiation by CNR4'
	units = 'W/m^2'
[End]

% pass through unfilled SW_OUT for Ameriflux
[Trace]
	variableName = 'SW_OUT_1_1_1'

	Evaluate = 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'

	title = 'reflected shortwave radiation by CNR4'
	units = 'W/m^2'

[End]

% pass through unfilled LW_IN for Ameriflux
[Trace]
	variableName    = 'LW_IN_1_1_1'
	Evaluate        = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title           = 'incoming long wave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName = 'LW_OUT_1_1_1'

	Evaluate = 'LW_OUT_1_1_1 = LW_OUT_1_1_1;'

	title = 'outgoing long wave radiation by CNR4'
	units = 'W/m^2'
	
[End]


[Trace]
	variableName = 'RG_F_1_1_1'

	Evaluate = 'RG_F_1_1_1 = SW_IN_F_1_1_1 + LW_IN_1_1_1;'

	title = 'Global Radiation - total incoming SW & LW'
	units = 'W/m^2'
	
[End]

% recalculate and pass through unfilled ALB for Ameriflux
% example of using calcAlb function
[Trace]
	variableName 	= 'ALB_1_1_1'
	Evaluate 		= 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);' 
	title 			= 'albedo by CNR4'
	units 			= '%'
[End]

% gap-filled ALB
[Trace]
	variableName 	= 'ALB_F_1_1_1'
	Evaluate 		= 'ALB_F_1_1_1 = calcAlb(SW_IN_F_1_1_1,SW_OUT_1_1_1);' 
	title 			= 'albedo by CNR4 using SW_IN gap-filled '
	units 			= '%'
[End]

% recalculate and pass through unfilled NETRAD for Ameriflux
% example of using calcNetRad function
[Trace]
	variableName 	= 'NETRAD_1_1_1'
	Evaluate 		= 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title 			= 'net radiation by CNR4'
	units 			= 'W/m^2'
[End]

% gap-filled NETRAD
[Trace]
	variableName 	= 'NETRAD_F_1_1_1'
	Evaluate 		= 'NETRAD_F_1_1_1 = calcNetRad(SW_IN_F_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);'
	title 			= 'net radiation by CNR4 using SW_IN (gap-filled) and LW_IN'
	units 			= 'W/m^2'
[End]


% pass through unfilled PPFD for Ameriflux
[Trace]
	variableName    = 'PPFD_IN_1_1_1'
	Evaluate        = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title           = 'incoming PAR'
	units           = '\mu mol/m^2/s'
[End]

[Trace]
	variableName = 'PPFD_IN_F_1_1_1'
	Evaluate = 'qaqcIn = [];
				qaqcIn.minSlope = 0.90;	% default is 1.05, determined 1.10 is justified in this case following testing
				qaqcIn.r2min = 0.90;		% default is 0.95, determined 0.90 is justified in this case following testing
				PPFD_IN_F_1_1_1 = gapFillUsingAltSensor(PPFD_IN_1_1_1,Young_PPFD_1_1_1,[],qaqcIn,1,"PPFD_IN_F_1_1_1");' %Young as backup
	title = 'incoming PAR'
	units = '\mu mol/m^2/s'
[End]

% ----------------------------------------------------------------------------
% Pressure and precipitation variables
% ----------------------------------------------------------------------------

% pass through unfilled PA for Ameriflux
[Trace]
	variableName    = 'PA_1_1_1'
	Evaluate        = 'PA_1_1_1 = PA;'
	title           = 'air pressure by CS106 installed in the logger box'
	units           = 'kPa'
[End]

[Trace]
	variableName    = 'PA_2_1_1'
	Evaluate        = 'PA_2_1_1 = PA_ECCC;'
	title           = 'air pressure from ECCC Shoal Lake station (10925)'
	units           = 'kPa'
[End]

% gap-filled PA -
% gap-fill PA_ECCC with PA (air_pressure from EddyPro) because ECCC is more stable, reliable, accurate
[Trace]
	variableName 	= 'PA_F_1_1_1'
	Evaluate 		= 'qaqcIn = [];
						qaqcIn.minSlope = 0.86; % default is 0.95, determined 0.86 is justified in this case following testing
						qaqcIn.r2min = 0.76; % default is 0.95, determined 0.76 is justified, there only one year (2024) it is lower than 0.86 (comment written June 2026)
						PA_F_1_1_1 = gapFillUsingAltSensor(PA_ECCC,PA,[],qaqcIn,1,"PA_F_1_1_1");'
	title 			= 'air pressure by CS106 installed in the logger box, gapfilled with ECCC data'
	units 			= 'kPa' 
[End]

% pass through unfilled P for Ameriflux
[Trace]
	variableName    = 'P_1_1_1'
	Evaluate        = 'P_1_1_1 = P_RAIN_1_1_1;'
	title           = 'precipitation at 1.05m height'
	units           = 'mm'
[End]

% Removed gap-filled P (precip), not good fit with Newdale
%[Trace]
%	variableName = 'P_F_1_1_1'
%	Evaluate = 'qaqcIn = [];
%				qaqcIn.minSlope = 0.15;	% default is 1.05, determined 1.10 is justified in this case following testing 
%				qaqcIn.r2min = 0.25;		% default is 0.95, 
%				P_F_1_1_1 = gapFillUsingAltSensor(P_RAIN_1_1_1,P_Newdale,[],[qaqcIn],1,"P_F_1_1_1");'% replace, do not average (creates weird precip amounts at multiple extra data points, which then remove flux data in third stage)
%	title = 'precipitation at 1.05m height'
%	units = 'mm' 
%[End]

% ----------------------------------------------------------------------------
% Wind speed and direction variables
% ----------------------------------------------------------------------------

% pass through unfilled WS for Ameriflux
[Trace]
	variableName    = 'WS_1_1_1'
	Evaluate        = 'WS_1_1_1 = WS;'
	title           = 'wind speed by CSAT'
	units           = 'm/s'
[End]

% Removed gap-filled WS, not good fit with Newdale
%[Trace]
%	variableName 	= 'WS_F_1_1_1'
%	Evaluate 		= 'qaqcIn = [];
%						qaqcIn.minSlope = 0.80;	% default is 1.05, determined 1.10 is justified in this case following testing
%						qaqcIn.r2min = 0.75;
%						WS_F_1_1_1 = gapFillUsingAltSensor(WS,WS_Newdale,[],qaqcIn,1,"WS_F_1_1_1");'
%	title 			= 'wind speed by csat'
%	units 			= 'm/s' 
%[End]

% pass through unfilled WD for Ameriflux
[Trace]
	variableName    = 'WD_1_1_1'
	Evaluate        = 'WD_1_1_1 = wind_dir;'
	title           = 'wind direction by RM Young 05103'
	units           = 'degrees'
[End]

% Removed gap-filled WD, not good fit with Newdale
%[Trace]
%	variableName 	= 'WD_F_1_1_1'
%	Evaluate 		= 'qaqcIn = [];
%						qaqcIn.minSlope = 0.90;	% default is 1.05, determined 1.10 is justified in this case following testing
%						qaqcIn.r2min = 0.75;
%						WD_F_1_1_1 = gapFillUsingAltSensor(wind_dir,WD_Newdale,[],qaqcIn,1,"WD_F_1_1_1");'
%	title 			= 'wind direction by csat'
%	units 			= 'degrees' 
%[End]

% ----------------------------------------------------------------------------
% Turbulent fluxes LI-7200 & LI-7700
% ----------------------------------------------------------------------------
[Trace]
	variableName = 'CO2'
	Evaluate = 'CO2 = CO2;'	% is this necessary?
	title = 'CO2 in mole fraction of wet air'
	units = '\mu mol / mol wet air'
[End]

[Trace]
	variableName = 'H2O'
	Evaluate = 'H2O = H2O;'
	title = 'H2O in mole fraction of wet air'
	units = 'mm mol / mol wet air'
[End]

[Trace]
	variableName = 'CH4'
	Evaluate = 'CH4 = CH4;'
	title = 'CH4 in mole fraction of wet air'
	units = 'nmol / mol wet air'
[End]

[Trace]
	variableName = 'USTAR'
	Evaluate = 'USTAR = USTAR;'
	title = 'Friction Velocity'
	units = 'm/s'
[End]

[Trace]
	variableName = 'w_ts_cov'
	Evaluate = 'w_ts_cov = w_ts_cov;'
	title = 'Covariance of w and sonic temperature (Sonic, after rotation)'
	units = 'm/s degK'
[End]

[Trace]
	variableName = 'w_h2o_cov'
	Evaluate = 'w_h2o_cov = w_h2o_cov;'
	title = 'Covariance of w and water vapour mixing ratio (after rotation)'
	units = 'm/s mmol/mol'
[End]

[Trace]
	variableName = 'w_co2_cov'
	Evaluate = 'w_co2_cov = w_co2_cov;'
	title = 'Covariance of w and CO2 (after rotation)'
	units = 'm/s umol/mol'
[End]

[Trace]
	variableName = 'w_ch4_cov'
	Evaluate = 'w_ch4_cov = w_ch4_cov;'
	title = 'Covariance of w and CH4 (after rotation)'
	units = 'm/s nmol/mol'
[End]

[Trace]
	variableName = 'LE'
	Evaluate = 'LE = LE;'
	title = 'Latent Heat Flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'SLE'
	Evaluate = 'SLE = SLE;'
	title = 'Estimate of storage latent heat flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'H'
	Evaluate = 'H = H;'
	title = 'sensible heat flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'SH'
	Evaluate = 'SH = SH;'
	title = 'Estimate of storage sensible heat flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'FC'
	Evaluate = 'FC = FC;'
	title = 'CO_2 Flux'
	units = '\mu mol m^{-2} s^{-1}'
[End]

[Trace]
	variableName = 'SC'
	Evaluate = 'SC = SC;'
	title = 'Estimate of storage CO2 flux'
	units = 'umol/m^2/s'
[End]

[Trace]
	variableName = 'FCH4'
	Evaluate = 'FCH4 = FCH4;'
	title = 'CH_4 Flux'
	units = 'nmol m^{-2} s^{-1}'
[End]

[Trace]
	variableName = 'SCH4'
	Evaluate = 'SCH4 = SCH4;'
	title = 'Estimate of storage CH4 flux'
	units = 'nmol m^{-2} s^{-1}'
[End]

[Trace]
	variableName = 'TKE'
	Evaluate = 'TKE = TKE;'
	title = 'Turbulent kinetic energy'
	units = 'm2 s-2'
[End]

[Trace]
    variableName = 'ET'
    Evaluate = 'ET = LE./Latent_heat_vaporization(TA_F_1_1_1); % use biomet helper for L_vap
				ET = ET*60*30;' % convert units from kg/m^2/s to mm/30min standard unit for EddyPro
    title = 'Evapotranspiration flux'
    units = 'mm 30min{-1}'          
[End]

[Trace]
	variableName = 'L'
	Evaluate = 'L = L;'
	title = 'Monin-Obukhov length'
	units = 'm'
[End]

[Trace]
	variableName = 'U_SIGMA'
	Evaluate = 'U_SIGMA = sqrt(u_var);'
	title = 'Standard deviation of velocity fluctuations'
	units = 'm s-1'
[End]

[Trace]
	variableName = 'V_SIGMA'
	Evaluate = 'V_SIGMA = sqrt(v_var);'
	title = 'Standard deviation of lateral velocity fluctuations'
	units = 'm s-1'
[End]

[Trace]
	variableName = 'W_SIGMA'
	Evaluate = 'W_SIGMA = sqrt(w_var);'
	title = 'Standard deviation of vertical velocity fluctuations'
	units = 'm s-1'
[End]

[Trace]
	variableName = 'TAU'
	Evaluate = 'TAU = TAU;'
	title = 'Corrected momentum flux'
	units = 'kg m-1 s-2'
[End]

[Trace]
	variableName = 'zdL'
	Evaluate = 'zdL = zdL;'
	title = 'Monin-Obukhov stability parameter. EddyPro output name: (z-d)/L'
	units = 'dimensionless'
[End]


% ----------------------------------------------------------------------------
% Misc Meteorological variables
% ----------------------------------------------------------------------------


[Trace]
	variableName = 'aerodynamic_resistance_momentum'

	Evaluate = '[ga_m_vel, ga_h_vel] = calc_aerodynamic_conductance(WS_1_1_1,USTAR,zdL);
                    aerodynamic_resistance_momentum = 1./ga_m_vel;'

	title = 'Aerodynamic resistance for momentum'
	units = 's m^{-1}'

[End]

[Trace]
	variableName = 'aerodynamic_resistance_scalar'

	Evaluate = '[ga_m_vel, ga_h_vel] = calc_aerodynamic_conductance(WS_1_1_1,USTAR,zdL);
                    aerodynamic_resistance_scalar = 1./ga_h_vel;'

	title = 'Aerodynamic resistance for heat and water vapour'
	units = 's m^{-1}'

[End]



[Trace]
	variableName = 'hpbl'

	Evaluate = 'hpbl = hpbl;'

	title = 'Estimated Height of Planetary Boundary Layer'
	units = 'm/s' 
	minMax = [0,3000]
[End]
