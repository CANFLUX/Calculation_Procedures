%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Second stage ini_file for BB
%
% May, 2022 Sara Knox
% Jan, 2023-Ongoing Adapted for BB by June Skeeter
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% Revisions:
%
% 15 May 2026 (Karolina)
%	- Corrected soil volumetric water content variable name (from VWC to SWC)
%
% 11 May 2026 (Karolina)
%   -  Edited gap filled variables to have correct Ameriflux formatting (e.g. TA_F_1_1_1 instead of TA_1_1_1_F). 
%   -  See bottom of webpage: https://ameriflux.lbl.gov/data/aboutdata/data-variables/
%
% 7 April 2026 (Rosie)
%	- Changed WS_/WD_ from 2_1_1 to 1_2_1: per database meeting discussion on 9 March 2026, determined they can be described 
%	  as vertical profile (like other BC sites). 
%
% 20 March 2026 (Rosie)
%	- Removed gap-filled precipitation, wind speed, and wind direction: nearest ECCC station not a good fit.
%	- PPFD_OUT_1_1_1 gap-filling is removed: SW_IN_1_1_1 is not a good enough fit. Missing max of ~2% data points, <1% in most years.
%
% 29 January 2026 (Rosie)
%	- BB is generally well-maintained/powered etc. so do not get a lot of missing data:
%		- Removed gap-filling for precipitation and wind speed/direction, generally not advised unless alternative sensor is collocated/very close. 
%		- Gap-filling RH_1_1_1 and RH_1_2_1 with RH_ECCC fails default qaqc in all years, sometimes on r^2 and slope, removed gap-filling.
%		  Also gap-filling RH_1_1_1 with RH_1_2_1 fails every year with default qaqc: both RH_ECCC and RH_1_2_1 NOT good fit, no gap-filling done.
%		  Usually missing approximately the same data points anyway so not worth it (and RH_1_2_1 does not exist after 2022).
%		- Changed gap-filled VPD to use gap-filled TA but NOT gap-filled RH as does not exist - still gain some data from this.
% 		- PPFD_IN can be reasonably gap-filled with SW_IN but most years appear to just be missing the same 
%	  	  few data points. However, useful for 2015 where PPFD_IN missing first few months, so kept in. 
%
% Dec 10, 2025 (Rosie & Zoran)
%   - Replaced all calc_avg_trace() calls with with either gapFillUsingAltSensor() or with mean().
%   - Found a few bad alternative traces that do not track site traces well enough and that
%     probably should not be used for gap filling.
%   - Added some command window outputs with some warnings/questions/reminders 
%     These will need to be removed after the relevant issues are resolved.
%   - Removed commented out and obsolete traces.
% 8 December 2025 (Rosie)
%	- Created and added functions vapPressDeficit, calcNetRad, and calcAlb, for recalculating VPD, NETRAD, and 
%	  ALB respectively, to reduce clutter. Functions include application of minMax values.
%
% 4 December 2025 (Rosie)
%	- Changed notation to be "Ameriflux-friendly": provide both non-gap-filled and gap-filled variables for AMF, 
%	  as well as gap-filled '_F' for internal/data sharing.
%
% 1 May 2025 (Rosie)
%	- Changed wind speed averaging to just replace gaps with ECCC data (no regression) as it created a bias (will work on fixing later):
%	- e.g. 'WS_1_1_1 = calc_avg_trace(clean_tv,WS_1_1_1,WS_ECCC,0);' (0 instead of -1)
%
% 1 April 2025 (Rosie)
% 	- Tidied up following addition of include files in first stage. 
%	- Added bounds to averaged RH to prevent > 100%
%	- Removed RH_1_2_1 for 2023 onwards, as first stage measurements are problematic for 2023/2024
%	- For earlier years where RH_1_2_1 exists, it probably should not be averaged with RH_ECCC, which is already averaged with RH_1_1_1? Different heights...
%	- Added NETRAD and ALB calculations back to second stage (removed from first stage RAD include file) on principle, because they are 
% 	  "modelled" not measured.

% Feb 3, 2023 (Zoran)
%   - changed 
%      searchPath = 'low_level,current'
%     to
%      searchPath = 'auto'
%
% 20230111: Modified for June Skeeter local database


Site_name = 'Burns Bog 1'
SiteID = 'BB'
input_path    = ''
output_path   = '' 
high_level_path = {}
searchPath = 'auto'

% Contents:
% Misc. variables
% Profiles
% Radiation
% Soil
% Turbulent fluxes
% Carbon balance terms
% Energy storage terms

% ----------------------------------------------------------------------------
% Misc. important variables - temperature, pressure etc.
% ----------------------------------------------------------------------------

% create a generic trace and variables
% the variables created here will be available to all other traces below
% and that saves some extra typing.
[Trace]
	variableName = 'all_nan'
	Evaluate = 'all_nan = nan(size(clean_tv));
                processingYear = yearIn;'
	title = 'definitions of a all_nan trace and some global variables'
	units = ''
[End]


% non-gap-filled temperature
[Trace]
	variableName = 'TA_1_1_1'
	Evaluate = 'TA_1_1_1 = TA_1_1_1;'
	title = 'Air temperature at 2m (HMP)'
	units = '^oC'
[End]

[Trace]
	variableName = 'TA_1_2_1'
	Evaluate = 'TA_1_2_1 = TA_1_2_1;'
	title = 'Air temperature at 30cm (HMP)'
	units = '^oC'
[End]

% gap-filled temperature
[Trace]
	variableName = 'TA_F_1_1_1'
	Evaluate = 'TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_ECCC,[],[],[],"TA_F_1_1_1");'
	title = 'Air temperature at 2m (HMP) gap-filled using ECCC'
	units = '^oC'
[End]

[Trace]
	variableName = 'TA_F_1_2_1'
	Evaluate = 'qaqcIn=[];
                qaqcIn.maxSlope = 1.13;	% determined 1.13 is justified after testing
                [TA_F_1_2_1,qaqcOut] = gapFillUsingAltSensor(TA_1_2_1,TA_1_1_1,[],qaqcIn,1,"TA_F_1_2_1");'
	title = 'Air temperature at 30cm (HMP) gap-filled using ECCC'
	units = '^oC'
[End]

% non-gap-filled RH
[Trace]
	variableName = 'RH_1_1_1'
	Evaluate = 'RH_1_1_1 = RH_1_1_1;'
	title = 'RH at 2m (HMP)'
	units = '%'
[End]

[Trace]
	variableName = 'RH_1_2_1'
    % This sensor went bad in 2023
	Evaluate = 'if(processingYear<2023),
                    RH_1_2_1 = RH_1_2_1;
                else,
                    RH_1_2_1 = all_nan;
                end;'
	title = 'RH at 30cm (HMP)'
	units = '%'
[End]

% gap-filled RH
% no gap-filling for RH, no suitable substitute data exists (see comments 29 January 2026)

% non-gap-filled VPD
[Trace]
	variableName = 'VPD_1_1_1'
	Evaluate = 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_1);'
	title = 'Vapour pressure deficit (from 2m HMP)'
	units = 'hPa'
[End]

[Trace]
	variableName = 'VPD_1_2_1'
	Evaluate = 'VPD_1_2_1 = vapPressDeficit(TA_1_2_1,RH_1_2_1);'
	title = 'Vapour pressure deficit (from 30cm HMP)'
	units = 'hPa'
[End]

% gap-filled VPD
[Trace]
	variableName = 'VPD_F_1_1_1'
	Evaluate = 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_1_1_1);'
	title = 'Vapour pressure deficit (from 2m HMP) using gap-filled TA and RH from ECCC'
	units = 'hPa'
[End]

[Trace]
	variableName = 'VPD_F_1_2_1'
	Evaluate = 'if(processingYear < 2023),
					VPD_F_1_2_1 = vapPressDeficit(TA_F_1_2_1,RH_1_2_1);
				else
					VPD_F_1_2_1 = VPD_1_1_1;	% need to provide this to third stage for all years (so do not use all_nan)
				end;'
	title = 'Vapour pressure deficit (from 30cm HMP) using gap-filled TA and RH from ECCC'
	units = 'hPa'
[End]

[Trace]
	variableName = 'TS_1_1_1'
	Evaluate = 'TS_1_1_1 = TS_1_1_1;'
	title = 'average soil temperature at 5cm depth'
	units = '^oC'
[End]

[Trace]
	variableName = 'TS_1_2_1'
	Evaluate = 'TS_1_2_1 = TS_1_2_1;'
	title = 'average soil temperature at 10cm depth'
	units = '^oC'
[End]

[Trace]
	variableName = 'TS_1_3_1'
	Evaluate = 'TS_1_3_1 = TS_1_3_1;'
	title = 'average soil temperature at 50cm depth'
	units = '^oC'
[End]



[Trace]
	variableName = 'G_1' 
	Evaluate = 'G_1 = mean([G_1_1_1, G_2_1_1, G_3_1_1],2,"omitnan");'
	title = 'soil heat flux at 5cm depth'
	units = '∞C'
[End]


[Trace]
	variableName = 'SW_IN_1_1_1'
	Evaluate = 'SW_IN_1_1_1 = SW_IN_1_1_1;'	
	title = 'incoming shortwave radiation by CNR1'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'SW_OUT_1_1_1'
	Evaluate = 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'
	title = 'reflected shortwave radiation by CNR1'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'LW_IN_1_1_1'
	Evaluate = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title = 'incoming long wave radiation by CNR1'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'LW_OUT_1_1_1'
	Evaluate = 'LW_OUT_1_1_1 = LW_OUT_1_1_1;'
	title = 'outgoing long wave radiation by CNR1'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'NETRAD_1_1_1'
	Evaluate = 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);' % see comments in header
	title = 'net radiation by CNR1'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'ALB_1_1_1'
	Evaluate = 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);' % see comment in header
	title = 'albedo from CNR1 SW'
	units = 'W/m^2'
[End]

% non gap-filled PPFD_IN
[Trace]
	variableName = 'PPFD_IN_1_1_1'
    Evaluate = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title = 'incoming PAR'
	units = '\mu mol/m^2/s'
[End]

% gap-filled PPFD_IN
[Trace]
	variableName = 'PPFD_IN_F_1_1_1'
    Evaluate = 'qaqcIn=[];
                qaqcIn.maxSlope = 1.78;		% determined 1.78 is justified after testing (r^2 always good)
                PPFD_IN_F_1_1_1 = gapFillUsingAltSensor(PPFD_IN_1_1_1,SW_IN_1_1_1,[],qaqcIn,1,"PPFD_IN_F_1_1_1");'
	title = 'incoming PAR'
	units = '\mu mol/m^2/s'
[End]

% non gap-filled PPFD_OUT
[Trace]
	variableName = 'PPFD_OUT_1_1_1'
    Evaluate = 'PPFD_OUT_1_1_1 = PPFD_OUT_1_1_1;'
	title = 'reflected PAR'
	units = '\mu mol/m^2/s'
[End]

% no gap-filled PPFD_OUT_1_1_1, SW_IN_1_1_1 not a good fit.

% non-gap-filled PA
[Trace]
	variableName = 'PA_1_1_1'
	Evaluate = 'if(processingYear < 2018),	% no data prior to 2018
					PA_1_1_1 = all_nan;
				else
					PA_1_1_1 = PA_1_1_1;
				end;'
	title = 'air pressure by CS106 installed in the logger box'
	units = 'kPa' 
[End]

% gap-filled PA
[Trace]
	variableName = 'PA_F_1_1_1'  
	Evaluate = 'if(processingYear < 2018),	% no data prior to 2018
					PA_F_1_1_1 = all_nan;	
				else 
					PA_F_1_1_1 = gapFillUsingAltSensor(PA_1_1_1,PA_ECCC,[],[],1,"PA_F_1_1_1");
				end;'
	title = 'air pressure by CS106 installed in the logger box, gap-filled using ECCC'
	units = 'kPa' 
[End]

% non-gap-filled precip
[Trace]
	variableName = 'P_1_1_1'
	Evaluate = 'P_1_1_1 = P_1_1_1;'
	title = 'precipitation at 1.05m height'
	units = 'mm' 
[End]

% gap-filled precip
% no gap-filled precipitation (see comments 20 March 2026)

[Trace]
	variableName = 'Bog_Height'
	Evaluate = 'if (processingYear < 2018),
					Bog_Height = all_nan;
				else
					Bog_Height = Bog_Height;
				end;'
	title = 'Bog Surface Height'
	units = 'm'
[End]


[Trace]
	variableName = 'WTH_1'
	Evaluate = 'WTH_1 = WTH_1_1_1;'
	title = 'water table height above the pressure transducer'
	units = 'cm'
[End]

[Trace]
	variableName = 'WTD_1'	
	Evaluate = 'WTD_1 = BB_WTH_Corrections_v2(SiteID,processingYear);
				WTD_1 = -.01*WTD_1;'
	title = 'water table depth corrected for pipe height and drift correction'
	units = 'cm'
[End]


[Trace]
	variableName = 'SWC_1_1_1'
	Evaluate = 'SWC_1_1_1=SWC_1_1_1;'
	title = 'volumetric water content with sensor in hollows'
	units = '%'
[End]

[Trace]
	variableName = 'SWC_2_1_1'
	Evaluate = 'SWC_2_1_1=SWC_2_1_1;'
	title = 'volumetric water content with sensor in hummocks'
	units = '%'
[End]

[Trace]
	variableName = 'SWC_3_1_1'
	Evaluate = 'SWC_3_1_1=SWC_3_1_1;'
	title = 'volumetric water content with sensor in current position (seems to be a better signal)'
	units = '%'
[End]

[Trace]
	variableName = 'SWC_4_1_1'
	Evaluate = 'SWC_4_1_1=SWC_4_1_1;'
	title = 'volumetric water content with sensor in current position (seems to be a better signal)'
	units = '%'
[End]

[Trace]
	variableName = 'ORP_1_1_1'
	Evaluate = 'ORP_1_1_1 = ORP_1_1_1;'
	title = 'oxygen reduction potential 10cm'
	units = 'mV'
[End]

[Trace]
	variableName = 'ORP_1_2_1'
	Evaluate = 'ORP_1_1_1 = ORP_1_2_1;'
	title = 'oxygen reduction potential 30cm'
	units = 'mV'
[End]

[Trace]
	variableName = 'pH_1_1_1'
	Evaluate = 'pH_1_1_1 = pH_1_1_1;'
	title = 'water pH 10cm'
	units = 'unitless'
[End]

[Trace]
	variableName = 'pH_1_2_1'
	Evaluate = 'pH_1_2_1 = pH_1_2_1;'
	title = 'water pH 30cm'
	units = 'unitless'
[End]

[Trace]
	variableName = 'TW_1_1_1'
	Evaluate = 'TW_1_1_1 = TW_1_1_1;'
	title = 'water temperature 10cm'
	units = '∞C'
[End]

[Trace]
	variableName = 'TW_1_2_1'
	Evaluate = 'TW_1_2_1 = TW_1_1_1;'
	title = 'water temperature 30cm'
	units = '∞C'
[End]

% non-gap-filled WS and WD
[Trace]
	variableName = 'WS_1_1_1'
	Evaluate = 'WS_1_1_1 = WS_1_1_1;'
	title = 'wind speed by RM Young 05103'
	units = 'm/s' 
[End]

[Trace]
	variableName = 'WD_1_1_1'
	Evaluate = 'WD_1_1_1 = WD_1_1_1;'
	title = 'wind direction by RM Young 05103'
	units = 'm/s' 
[End]

% may return and test ERA5 at some point for WS/WD
% gap-filled WS and WD
