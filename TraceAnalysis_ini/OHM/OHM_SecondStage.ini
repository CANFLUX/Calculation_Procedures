%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Second stage ini_file for OHM
%
% Sep, 2023 Copied from HOGG INI by Ted Scott
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% Revisions:
%
% September 16, 2026 (Rosie)
%	- Passing PA_1_1_1 from first stage instead of PA (was missing Ameriflux notation in first stage, now added),
%	  removed unit conversion - now done in first stage. 
%	  PA_1_1_1 uses air_p_mean, rather than air_pressure (unreliable), from EC system.
%
% September 14, 2026 (Joyson)
%	- added qaqcIn.minSlope for RH_F_1_1_1 and SW_IN_1_1_1_F
%	- removed division by 1000 in PA_F_1_1_1
%
% Jul 16, 2026 (Joyson)
%	- removed gap-filling for P, WS, and WD: alternative station data not good enough fit. as per Rosie Young ini file
%
% May 21, 2026 (Joyson)
%	- changed gapfilled name to F_1_1_1 using Zoran code
%
% Apr 07, 2026 (Joyson)
%	-updated based on Rosie example ini file
%	- changed calc_avg_trace to gapFillUsingAltSensor
%
% March 04, 2025 (Joyson)
%	- added Qualifier to PA and WS
%	- VPD calc calculation using vapPressMet instead of vappress 
%	  to make uniform with Young and Hogg
%
% Jan 22, 2025 (Paul)
%	- Removed badWD filter. Wind direction filtering now done in third stage.
%
% May 21, 2024 (Zoran)
%   - Replaced:
%		badWD = find(WD_1_1_1 >= lower | WD_1_1_1 <= upper);
%     with:
%   	badWD = (WD_1_1_1 >= lower | WD_1_1_1 <= upper);
%	  to avoid having a trace badWD that is not of a full length. 
%     The original line would return < 17,520 points.
% Oct 11, 2023 (Ted)
%	- Updated to remove YOUNG values as backups as OHM is not near YOUNG
%	- Removed all shiftMyData calls
%
% Oct 17, 2023 (Ted)
%	- added NEE following pattern in YOUNG/HOGG 2nd stages
%
% Jan 15, 2024 (Ted)
%	- add Evapotranspiration (ET) using LE and Latent_heat_vaporization biomet function
%
% Jan 18, 2024 (Ted)
%	- cleanup of lines using calc_avg_trace with single argument
%
% Jan 29, 2024 (Ted)
%	- create WD filter trace "badWD" to use for cleaning out fluxes when wind is disturbed by tower before sonic
%

Site_name = 'Oak Hammond Marsh'
SiteID = 'OHM'
input_path    = ''
output_path   = ''
high_level_path = {}
searchPath = 'auto'

% Contents:
% Misc. variables
% Profiles
% Radiation
% Soil
% Turbulent fluxes
% Carbon balance terms
% Energy storage terms


% ----------------------------------------------------------------------------
% GASES
% ----------------------------------------------------------------------------

[Trace]
	variableName = 'CO2'
	Evaluate = 'CO2 = CO2;'
	title = 'CO2 in mole fraction of wet air'
	units = 'µmol / mol wet air'
[End]

[Trace]
	variableName = 'CO2_SIGMA'
	Evaluate = 'CO2_SIGMA = sqrt(co2_var);'
	title = 'Standard deviation of velocity fluctuations'
	units = 'm s^{-1}'
[End]

[Trace]
	variableName = 'FC'
	Evaluate = 'FC = FC;'
	title = 'CO_2 Flux'
	units = 'µmol m^{-2} s^{-1}'
[End]

[Trace]
	variableName = 'SC'
	Evaluate = 'SC = SC;
				fill_w_zeros = isnan(SC) & ~isnan(FC);
				SC(fill_w_zeros) = 0;'
	title = 'Estimate of storage CO2 flux'
	units = 'µmol/m^2/s'
[End]

[Trace]
	variableName = 'H2O'
	Evaluate = 'H2O = H2O;'
	title = 'H2O in mole fraction of wet air'
	units = 'mmol / mol wet air'
[End]

[Trace]
	variableName = 'H2O_SIGMA'
	Evaluate = 'H2O_SIGMA = sqrt(h2o_var);'
	title = 'Standard deviation of velocity fluctuations'
	units = 'm s^{-1}'
[End]

[Trace]
	variableName = 'CH4'
	Evaluate = 'CH4 = CH4;'
	title = 'CH4 in mole fraction of wet air'
	units = 'nmol / mol wet air'
[End]

[Trace]
	variableName = 'FCH4'
	Evaluate = 'FCH4 = FCH4;'
	title = 'CH_4 Flux'
	units = 'nmol m^{-2} s^{-1}'
[End]

[Trace]
	variableName = 'SCH4'
	Evaluate = 'SCH4 = SCH4;'
	title = 'Estimate of storage CH4 flux'
	units = 'nmol m^{-2} s^{-1}'
[End]


% ----------------------------------------------------------------------------
% HEAT
% ----------------------------------------------------------------------------

[Trace]
	variableName = 'LE'
	Evaluate = 'LE = LE;'
	title = 'Latent Heat Flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'SLE'
	Evaluate = 'SLE = SLE;'
	title = 'Estimate of storage latent heat flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'H'
	Evaluate = 'H = H;'
	title = 'sensible heat flux'
	units = 'W m^{-2}'
[End]

[Trace]
	variableName = 'SH'
	Evaluate = 'SH = SH;'
	title = 'Estimate of storage sensible heat flux'
	units = 'W m^{-2}'
[End]


% ----------------------------------------------------------------------------
% MET_ATM
% ----------------------------------------------------------------------------

% pass through unfilled PA for Ameriflux
[Trace]
	variableName    = 'PA_1_1_1'
	Evaluate 		= 'PA_1_1_1 = PA_1_1_1;'
	title           = 'air pressure from EC system, using air_p_mean'
	units           = 'kPa'
[End]

[Trace]
	variableName = 'PA_F_1_1_1' %added qualifier by Joyson
	Evaluate = 'qaqcIn = [];
				qaqcIn.r2min = 0.95; % default is 0.95, determined 0.90 is justified in this case following testing
				PA_F_1_1_1 = gapFillUsingAltSensor(PA_1_1_1,PA_ECCC,[],qaqcIn,1,"PA_F_1_1_1");'
	title = 'Atmospheric Pressure'
	units = 'kPa' 
[End]

% pass through unfilled RH for Ameriflux
% Example of using processingYear and all_nan for handling missing data
[Trace]
	variableName    = 'RH_1_1_1'
    Evaluate        = 'RH_1_1_1 = RH_1_1_2;'			   
	title           = 'RH at 4 m (HMP)'
	units           = '%'
[End]

[Trace]
	variableName = 'RH_F_1_1_1'
	Evaluate = 'qaqcIn = [];
				qaqcIn.polyfitWithoutClamped = 2;
                qaqcIn.clamped_minMax = [0,100];
				qaqcIn.minSlope = 0.85;
				qaqcIn.r2min = 0.90; % default is 0.95, determined 0.90 is justified in this case following testing
				RH_F_1_1_1 = gapFillUsingAltSensor(RH_1_1_2,RH_Stonewall,[],[qaqcIn],1,"RH_F_1_1_1");'
	title = 'RH at 4m (HMP)'
	units = '%'
[End]

[Trace]
	variableName = 'T_SONIC'
	Evaluate = 'T_SONIC = T_SONIC;'
	title = 'Mean temperature of ambient air as measured by the anemometer'
	units = '°C'
[End]

[Trace]
	variableName = 'T_SONIC_SIGMA'
	Evaluate = 'T_SONIC_SIGMA = sqrt(ts_var);'
	title = 'Standard deviation of sonic temperature'
	units = '°C'
[End]

% pass through unfilled TA for Ameriflux
[Trace]
	variableName    = 'TA_1_1_1'
	Evaluate        = 'TA_1_1_1 = TA_1_1_1;'
	title           = 'Air temperature at 4m (HMP)'
	units           = '^oC'
[End]

[Trace]
	variableName = 'TA_F_1_1_1'
	Evaluate = 'TA_F_1_1_1 = gapFillUsingAltSensor(TA_1_1_1,TA_Stonewall,[],[],1,"TA_F_1_1_1");
				TA_F_1_1_1 = gapFillUsingAltSensor(TA_F_1_1_1,TA_ECCC,[],[],1,"TA_F_1_1_1");'
	title = 'Air temperature at 4m (HMP)'
	units = '^oC'
[End]

% pass through/derive unfilled VPD for Ameriflux
% example of using vapPressDeficit function
[Trace]
	variableName    = 'VPD_1_1_1'
	Evaluate 		= 'VPD_1_1_1 = vapPressDeficit(TA_1_1_1,RH_1_1_2);'
	title           = 'Vapour pressure deficit (from 4m HMP)'
	units           = 'hPa'
[End]

[Trace]
	variableName    = 'VPD_F_1_1_1'
	Evaluate 		= 'VPD_F_1_1_1 = vapPressDeficit(TA_F_1_1_1,RH_F_1_1_1);'
	title           = 'Vapour pressure deficit (from 4m HMP)'
	units           = 'hPa'
[End]

% ----------------------------------------------------------------------------
% MET_PRECIP
% ----------------------------------------------------------------------------
% pass through unfilled P for Ameriflux
[Trace]
	variableName    = 'P_1_1_1'
	Evaluate        = 'P_1_1_1 = P_RAIN_1_1_1;'
	title           = 'precipitation at 1.05m height'
	units           = 'mm'
[End]

% Removed gap-filled P (precip), not good fit with Stonewall
%[Trace]
%	variableName = 'P_F_1_1_1'
%	Evaluate = 'qaqcIn = [];
%				qaqcIn.maxSlope = 1.05;	% default is 1.05, determined 1.10 is justified in this case following testing
%				qaqcIn.minSlope = 0.10;
%				qaqcIn.r2min = 0.30;
%				P_F_1_1_1 = gapFillUsingAltSensor(P_RAIN_1_1_1,P_Stonewall,[],[qaqcIn],1,"P_F_1_1_1");'% add P_ECCC if needed
%	title = 'precipitation at 1.05m height'
%	units = 'mm' 
%[End]



% ----------------------------------------------------------------------------
% MET_RAD
% ----------------------------------------------------------------------------

[Trace]
	variableName = 'LW_IN_1_1_1'
	Evaluate = 'LW_IN_1_1_1 = LW_IN_1_1_1;'
	title = 'incoming long wave radiation by CNR4'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'LW_OUT_1_1_1'
	Evaluate = 'LW_OUT_1_1_1 = LW_OUT_1_1_1;'
	title = 'outgoing long wave radiation by CNR4'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'PPFD_IN_1_1_1'
	Evaluate = 'PPFD_IN_1_1_1 = PPFD_IN_1_1_1;'
	title = 'incoming PAR'
	units = 'µmol/m^2/s'
[End]

% pass through unfilled SW_IN for Ameriflux
[Trace]
	variableName    = 'SW_IN_1_1_1'
	Evaluate        = 'SW_IN_1_1_1 = SW_IN_1_1_1;'
	title           = 'incoming shortwave radiation by CNR4'
	units           = 'W/m^2'
[End]

[Trace]
	variableName = 'SW_IN_F_1_1_1'
	Evaluate = 'qaqcIn = [];
				qaqcIn.maxSlope = 1.10;	% default is 1.05, determined 1.10 is justified in this case following testing
				qaqcIn.minSlope = 0.85;
				qaqcIn.r2min = 0.90;		% default is 0.95, determined 0.90 is justified in this case following testing
				SW_IN_F_1_1_1 = gapFillUsingAltSensor(SW_IN_1_1_1,Stonewall_SW_IN_1_1_1,[],[qaqcIn],1,"SW_IN_F_1_1_1");'
				 %Hogg as backup - add this if you want to add HOGG as backup gapFillUsingAltSensor(SW_IN_1_1_1_F,Hogg_SW_IN_1_1_1,[],[],1,"SW_IN_1_1_1_F");
	title = 'incoming shortwave radiation by CNR4'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'SW_OUT_1_1_1'
	Evaluate = 'SW_OUT_1_1_1 = SW_OUT_1_1_1;'
	title = 'reflected shortwave radiation by CNR4'
	units = 'W/m^2'
[End]

% recalculate and pass through unfilled ALB for Ameriflux
% example of using calcAlb function
[Trace]
	variableName 	= 'ALB_1_1_1'
	Evaluate 	= 'ALB_1_1_1 = calcAlb(SW_IN_1_1_1,SW_OUT_1_1_1);
					ALB_1_1_1(ALB_1_1_1<1E-05) = NaN;
					ALB_1_1_1(ALB_1_1_1>100) = NaN;'
	title 			= 'albedo by CNR4'
	units 			= '%'
[End]

% gap-filled ALB
[Trace]
	variableName 	= 'ALB_F_1_1_1'
	Evaluate 		= 'ALB_F_1_1_1 = calcAlb(SW_IN_F_1_1_1,SW_OUT_1_1_1);
					ALB_F_1_1_1(ALB_F_1_1_1<1E-05) = NaN;
					ALB_F_1_1_1(ALB_F_1_1_1>100) = NaN;' 
	title 			= 'albedo by CNR4 using SW_IN gap-filled '
	units 			= '%'
[End]

% recalculate and pass through unfilled NETRAD for Ameriflux
% example of using calcNetRad function
[Trace]
	variableName 	= 'NETRAD_1_1_1'
	Evaluate 		= 'NETRAD_1_1_1 = calcNetRad(SW_IN_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);
						NETRAD_1_1_1(NETRAD_1_1_1<-200) = NaN;
						NETRAD_1_1_1(NETRAD_1_1_1>1000) = NaN;'
	title 			= 'net radiation by CNR4'
	units 			= 'W/m^2'
[End]

% gap-filled NETRAD
[Trace]
	variableName 	= 'NETRAD_F_1_1_1'
	Evaluate 		= 'NETRAD_F_1_1_1 = calcNetRad(SW_IN_F_1_1_1,SW_OUT_1_1_1,LW_IN_1_1_1,LW_OUT_1_1_1);
						NETRAD_F_1_1_1(NETRAD_F_1_1_1<-200) = NaN;
						NETRAD_F_1_1_1(NETRAD_F_1_1_1>1000) = NaN;'
	title 			= 'net radiation by CNR4 using SW_IN (gap-filled) and LW_IN'
	units 			= 'W/m^2'
[End]

% ----------------------------------------------------------------------------
% MET_SOIL
% ----------------------------------------------------------------------------

[Trace]
	variableName = 'TS_1_1_1'
	Evaluate = 'TS_1_1_1 = TS_1_1_1;'
	title = 'average soil temperature at 10cm below soil-water interface'
	units = '°C'
[End]

[Trace]
	variableName = 'TS_2_1_1'
	Evaluate = 'TS_2_1_1 = TS_2_1_1;'
	title = 'average soil temperature at 20cm? above soil-water interface'
	units = '°C'
[End]

[Trace]
	variableName = 'TS_3_1_1'
	Evaluate = 'TS_3_1_1 = TS_3_1_1;'
	title = 'average soil temperature at 40cm above soil-water interface'
	units = '°C'
[End]


% ----------------------------------------------------------------------------
% MET_WIND
% ----------------------------------------------------------------------------

[Trace]
	variableName = 'MO_LENGTH'
	Evaluate = 'MO_LENGTH = L;'
	title = 'Monin-Obukhov length'
	units = 'm'
[End]

[Trace]
	variableName = 'TAU'
	Evaluate = 'TAU = TAU;'
	title = 'Corrected momentum flux'
	units = 'kg m^-{1} s^{-2}'
[End]

[Trace]
	variableName = 'U_SIGMA'
	Evaluate = 'U_SIGMA = sqrt(u_var);'
	title = 'Standard deviation of velocity fluctuations'
	units = 'm s^{-1}'
[End]

[Trace]
	variableName = 'USTAR'
	Evaluate = 'USTAR = USTAR;'
	title = 'Friction Velocity'
	units = 'm/s'
[End]

[Trace]
	variableName = 'V_SIGMA'
	Evaluate = 'V_SIGMA = sqrt(v_var);'
	title = 'Standard deviation of lateral velocity fluctuations'
	units = 'm s^{-1}'
[End]

[Trace]
	variableName = 'W_SIGMA'
	Evaluate = 'W_SIGMA = sqrt(w_var);'
	title = 'Standard deviation of vertical velocity fluctuations'
	units = 'm s^{-1}'
[End]

% pass through unfilled WS for Ameriflux
[Trace]
	variableName    = 'WS_1_1_1'
	Evaluate        = 'WS_1_1_1 = WS;'
	title           = 'wind speed by CSAT'
	units           = 'm/s'
[End]

% Removed gap-filled WS, not good fit with Stonewall
%[Trace]
%	variableName = 'WS_F_1_1_1'
%	Evaluate = 'qaqcIn = [];
%				qaqcIn.minSlope = 0.65;	% default is 1.05, determined 1.10 is justified in this case following testing
%				qaqcIn.r2min = 0.75;
%				WS_F_1_1_1 = gapFillUsingAltSensor(WS,WS_Stonewall,[],qaqcIn,1,"WS_F_1_1_1");' %add WS_ECCC if needed
%	title = 'wind speed by csat'
%	units = 'm/s' 
%[End]

% pass through unfilled WD for Ameriflux
[Trace]
	variableName    = 'WD_1_1_1'
	Evaluate        = 'WD_1_1_1 = wind_dir;'
	title           = 'wind direction by RM Young 05103'
	units           = 'degrees'
[End]

% Removed gap-filled WD, not good fit with Stonewall
%[Trace]
%	variableName = 'WD_F_1_1_1'
%	Evaluate = 'qaqcIn = [];
%				qaqcIn.minSlope = 0.90;	% default is 1.05, determined 1.10 is justified in this case following testing
%				qaqcIn.r2min = 0.60;
%				WD_F_1_1_1 = gapFillUsingAltSensor(wind_dir,WD_Stonewall,[],qaqcIn,1,"WD_F_1_1_1");' % add WD_ECCC if needed
%	title = 'wind direction by csat'
%	units = 'degrees' 
%[End]

[Trace]
	variableName = 'zdL' % changed to small letter to match with other sites
	Evaluate = 'zdl = zdL;'
	title = 'Monin-Obukhov stability parameter. EddyPro output name: (z-d)/L'
	units = 'dimensionless'
[End]


% ----------------------------------------------------------------------------
% PRODUCTS
% ----------------------------------------------------------------------------

%[Trace]
%	variableName = 'NEE'
%	Evaluate = 'NEE = sum([FC,SC],2,''omitnan'');
%		    NEE(all(isnan(FC)&isnan(SC),2)) = NaN;'
%	title = 'Net ecosystem exchange'
%	units = 'µmol m^{-2} s^{-1}'
%[End]


% ----------------------------------------------------------------------------
% Misc variables
% ----------------------------------------------------------------------------

[Trace]
	variableName = 'TKE'
	Evaluate = 'TKE = TKE;'
	title = 'Turbulent kinetic energy'
	units = 'm^2 s-2'
[End]

[Trace]
    variableName = 'ET'
    Evaluate = 'ET = LE./Latent_heat_vaporization(TA_F_1_1_1); % use biomet helper for L_vap
				ET = ET*60*30;' % convert units from kg/m^2/s to mm/30min standard unit for EddyPro
    title = 'Evapotranspiration flux'
    units = 'mm 30min^{-1}'          
[End]

%[Trace]
%	variableName = 'RG_1_1_1'
%	Evaluate = 'RG_1_1_1 = SW_IN_1_1_1+LW_IN_1_1_1;'
%	title = 'Global Radiation - total incoming SW & LW'
%	units = 'W/m^2'
%[End]

[Trace]
	variableName = 'RG_F_1_1_1'
	Evaluate = 'RG_F_1_1_1 = SW_IN_F_1_1_1+LW_IN_1_1_1;'
	title = 'Global Radiation - total incoming SW & LW'
	units = 'W/m^2'
[End]

[Trace]
	variableName = 'aerodynamic_resistance_momentum'
	Evaluate = '[ga_m_vel, ga_h_vel] = calc_aerodynamic_conductance(WS_1_1_1,USTAR,zdL); %change WS to WS_1_1_1 and ZL to zdL
                    aerodynamic_resistance_momentum = 1./ga_m_vel;'
	title = 'Aerodynamic resistance for momentum'
	units = 's m^{-1}'
	minMax = [0,50000]
[End]

[Trace]
	variableName = 'aerodynamic_resistance_scalar'
	Evaluate = '[ga_m_vel, ga_h_vel] = calc_aerodynamic_conductance(WS_1_1_1,USTAR,zdL); %change WS to WS_1_1_1 and ZL to zdL
                    aerodynamic_resistance_scalar = 1./ga_h_vel;'
	title = 'Aerodynamic resistance for heat and water vapour'
	units = 's m^{-1}'
	minMax = [0,50000]
[End]

[Trace]
	variableName = 'hpbl'
	Evaluate = 'hpbl = hpbl;'
	title = 'Estimated Height of Planetary Boundary Layer'
	units = 'm/s' 
	minMax = [0,3000]
[End]
